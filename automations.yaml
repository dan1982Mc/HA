    id: kitchen_no_motion_5min
  - trigger: time
    at: 06:30:00
    id: morning_reset
  - trigger: time
    at: 06:35:00
    id: coffee_toggle
  - trigger: time
    at: 07:30:00
    id: shutdown_check
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: morning_reset
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.morning_oven_activated
    - conditions:
      - condition: trigger
        id: coffee_toggle
      sequence:
      - action: switch.toggle
        target:
