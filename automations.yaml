      target_date: "{% if trigger.id == 'tomorrow' %}\n  {{ (now() + timedelta(days=1)).strftime('%Y-%m-%d')
        }}\n{% else %}\n  {{ now().strftime('%Y-%m-%d') }}\n{% endif %}\n"
  - action: calendar.get_events
    target:
      entity_id: calendar.casa
    data:
      start_date_time: '{{ target_date }} 00:00:00'
      end_date_time: '{{ target_date }} 23:59:59'
    response_variable: casa_events
  - condition: template
    value_template: '{{ casa_events[''calendar.casa''].events | count > 0 }}

      '
  - variables:
      bin_color: '{% set event = casa_events[''calendar.casa''].events[0].summary
        %} {{ ''albastru'' if ''Carton'' in event else ''verde'' }}

        '
  - action: media_player.volume_set
    target:
      entity_id: media_player.2e_echo_dot_dan
    data:
      volume_level: 0.3
  - action: media_player.play_media
    target:
      entity_id: media_player.2e_echo_dot_dan
