        metadata: {}
  - delay:
      seconds: 1
  - action: tts.speak
    target:
      entity_id: tts.piper
    data:
      media_player_entity_id: media_player.2e_echo_dot_dan
      message: "{% for reminder in reminders %}\n  {{ reminder }}{% if not loop.last
        %}. {% endif %}\n{% endfor %}\n"
