        media_player_entity_id:
        - media_player.dan_s_echo_dot
        - media_player.2e_echo_dot_dan
        - media_player.kitchen_clock
        message: Udarea gazonului s-a finalizat. Grădina din spate este acum accesibilă.
        options:
          voice: ro_RO-lili-medium
    else:
    - action: media_player.volume_set
      target:
        entity_id:
        - media_player.dan_s_echo_dot
        - media_player.2e_echo_dot_dan
      data:
        volume_level: 0.1
    - action: media_player.volume_set
      target:
        entity_id: media_player.kitchen_clock
      data:
        volume_level: 0.1
    - action: tts.speak
      target:
        entity_id: tts.piper
      data:
        cache: true
        media_player_entity_id:
        - media_player.dan_s_echo_dot
        - media_player.2e_echo_dot_dan
        - media_player.kitchen_clock
        message: Sesiunea a fost anulată deoarece sunt prognozați {{ rain_today }}
