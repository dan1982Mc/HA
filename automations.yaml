          casă și să nu mergeți în grădina din spate pentru a evita să fiți udați.
        options:
          voice: ro_RO-lili-medium
    - delay: 00:05:00
    - action: switch.turn_on
      target:
        entity_id: switch.water_valve
    - delay: 00:30:00
    - action: switch.turn_off
      target:
        entity_id: switch.water_valve
    - action: tts.speak
      target:
        entity_id: tts.piper
      data:
        cache: true
        media_player_entity_id: media_player.2e_echo_dot_dan
        message: Udarea gazonului s-a finalizat. Grădina din spate este acum accesibilă.
        options:
          voice: ro_RO-lili-medium
    else:
    - action: media_player.volume_set
      target:
        entity_id: media_player.2e_echo_dot_dan
      data:
        volume_level: 0.1
    - action: tts.speak
      target:
        entity_id: tts.piper
      data:
        cache: true
        media_player_entity_id: media_player.2e_echo_dot_dan
        message: Sesiunea a fost anulată deoarece sunt prognozați {{ rain_today }}
          mm de precipitații.
        options:
          voice: ro_RO-lili-medium
    - stop: Sesiunea a fost anulată deoarece sunt prognozați {{ rain_today }} mm de
        precipitații.
