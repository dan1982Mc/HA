- id: '1781638179716'
  alias: Watering - 1 Time/Day
  description: Water for 15 mins at 7:00. Skips sessions based on rain.
  triggers:
  - trigger: time
    at:
    - 06:00:00
  actions:
  - action: weather.get_forecasts
    data:
      type: daily
    target:
      entity_id: weather.buienradar
    response_variable: daily_forecast
  - variables:
      rain_today: '{{ daily_forecast[''weather.buienradar''].forecast[0].precipitation
        | float(0) }}'
      scheduled_time: '{{ (now() + timedelta(minutes=5)).strftime(''%H:%M'') }}'
  - if:
    - condition: template
      value_template: "{% if rain_today > 6 %}\n  false\n{% elif rain_today > 3 and
        scheduled_time in ['13:30', '19:00'] %}\n  false\n{% elif rain_today > 1 and
        scheduled_time == '13:30' %}\n  false\n{% else %}\n  true\n{% endif %}\n"
    then:
    - action: media_player.volume_set
      target:
        entity_id: media_player.2e_echo_dot_dan
