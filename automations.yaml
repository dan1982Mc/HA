      seconds: 1
  - action: tts.speak
    target:
      entity_id: tts.piper
    data:
      media_player_entity_id: media_player.2e_echo_dot_dan
      message: "{% if trigger.id == 'tomorrow' %}\n  Mâine se ridică gunoiul\n  {{
        'de carton' if bin_color == 'albastru' else 'de grădină' }}.\n  Tomberonul
        {{ bin_color }} trebuie scos la stradă.\n{% else %}\n  Bună dimineața! Nu
