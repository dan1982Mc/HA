        target:
          entity_id: light.kitchen_lights_all
      - if:
        - condition: state
          entity_id: input_boolean.morning_oven_activated
          state: 'off'
        then:
        - action: switch.turn_on
          target:
            entity_id: switch.oven_power
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.morning_oven_activated
    - conditions:
      - condition: trigger
        id: kitchen_no_motion_5min
      - condition: time
