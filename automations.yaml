- id: '1776600441122'
  alias: Laundry - Washing Machine - Notifications
  description: Handles spin cycle detection and adjusts tone based on user action.
    Only on Dan's 2E Echo.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.smart_plug_3_current
    below: 0.1
    for:
      minutes: 15
  conditions:
  - condition: state
    entity_id: device_tracker.dan_sm_a528b
    state: home
  actions:
  - action: media_player.volume_set
    target:
      entity_id: media_player.2e_echo_dot_dan
    data:
      volume_level: 0.3
  - action: tts.speak
    target:
      entity_id: tts.piper
    data:
      cache: true
      media_player_entity_id: media_player.2e_echo_dot_dan
      message: Ciclul de spălare pare să se fi oprit. Vă rugăm să porniți programul
        de stoarcere de cincisprezece minute.
      options:
        voice: ro_RO-lili-medium
  - wait_for_trigger:
    - trigger: numeric_state
      entity_id: sensor.smart_plug_3_current
      above: 0.5
    timeout: 00:30:00
    continue_on_timeout: true
  - if:
    - condition: template
      value_template: '{{ wait.trigger is not none }}'
    then:
    - wait_for_trigger:
      - trigger: numeric_state
        entity_id: sensor.smart_plug_3_current
        below: 0.1
        for:
          minutes: 2
    - if:
      - condition: state
        entity_id: device_tracker.dan_sm_a528b
        state: home
      then:
      - action: tts.speak
        target:
          entity_id: tts.piper
        data:
          cache: true
          media_player_entity_id: media_player.2e_echo_dot_dan
          message: Stoarcerea s-a finalizat. Este timpul să mutați hainele în uscător.
          options:
            voice: ro_RO-lili-medium
    else:
    - if:
      - condition: state
        entity_id: device_tracker.dan_sm_a528b
        state: home
      then:
      - action: tts.speak
        target:
          entity_id: tts.piper
        data:
          cache: true
          media_player_entity_id: media_player.2e_echo_dot_dan
          message: Ai uitat să pornești ciclul de stoarcere și asta nu este bine deloc!
          options:
            voice: ro_RO-lili-medium
  - delay: 02:30:00
  - if:
    - condition: numeric_state
      entity_id: sensor.smart_plug_3_current
      above: 0.05
      below: 0.1
    - condition: state
      entity_id: device_tracker.dan_sm_a528b
      state: home
    then:
    - action: tts.speak
      target:
        entity_id: tts.piper
      data:
        cache: true
        media_player_entity_id: media_player.2e_echo_dot_dan
        message: "{% if wait.trigger is not none %}\n  Spălarea s-a terminat de trei
          ore și hainele vor începe să prindă miros. Mută-le acum în uscător!\n{%
          else %}\n  Spălarea s-a terminat de peste trei ore și hainele nu se vor
          muta singure în uscător. Mișcă-te odată!\n{% endif %}\n"
        options:
          voice: ro_RO-lili-medium
