- id: '1790188258678'
  alias: Toilet - Count Door Cycles
  description: Counts completed toilet door cycles and resets after 35 minutes without
    another cycle.
  triggers:
  - trigger: state
    entity_id: binary_sensor.toilet_door_contact
    from: 'on'
    to: 'off'
    id: door_cycle
  - trigger: state
    entity_id: counter.toilet_door_cycles
    to: '1'
    for:
      minutes: 35
    id: reset_from_1
  - trigger: state
    entity_id: counter.toilet_door_cycles
    to: '2'
    for:
      minutes: 35
    id: reset_from_2
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: door_cycle
      - condition: numeric_state
        entity_id: counter.toilet_door_cycles
        below: 2
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.toilet_door_cycles
    - conditions:
      - condition: trigger
        id:
        - reset_from_1
        - reset_from_2
      - condition: numeric_state
        entity_id: counter.toilet_door_cycles
        above: 0
      sequence:
      - action: counter.reset
        target:
          entity_id: counter.toilet_door_cycles
  mode: single
- id: '1790188314257'
  alias: Toilet - Light Off After Exit
  description: Turns off the toilet light 10 minutes after the second completed door
    cycle.
  triggers:
  - trigger: state
    entity_id: counter.toilet_door_cycles
    to: '2'
  conditions:
  - condition: numeric_state
    entity_id: sensor.toilet_light_sensor_illuminance
    above: 50
  actions:
  - delay:
      minutes: 10
  - condition: state
    entity_id: binary_sensor.toilet_door_contact
    state: 'off'
  - condition: numeric_state
    entity_id: sensor.toilet_light_sensor_illuminance
    above: 50
  - action: switch.toggle
    target:
      entity_id: switch.bot_3061_toilet_2
  - action: counter.reset
    target:
      entity_id: counter.toilet_door_cycles
  mode: single
- id: '1791459697971'
  alias: Eva Alexa Quiet Lock
  description: Prevent 2e Echo from playing during Eva final school departure period
  triggers:
  - trigger: state
    entity_id: media_player.2e_echo_dot_dan
    to: playing
  - trigger: state
    entity_id: media_player.2e_echo_dot_dan
    to: buffering
  conditions:
  - condition: time
    after: 07:50:00
    before: 08:00:00
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  - condition: state
    entity_id: calendar.eva_vacante
    state: 'off'
  actions:
  - action: media_player.media_pause
    target:
      entity_id: media_player.2e_echo_dot_dan
  mode: restart
- id: '1791468031017'
  alias: Unused Room Lights - Master
  description: Turn off room lights when all assigned activity sensors have been inactive
    for the configured time.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.kitchen_motion_sensor
    - binary_sensor.motionsensor_hal_switchbot_plinth
    - binary_sensor.small_bedroom_motion_occupancy
    - binary_sensor.motionsensor_kitchen_exhaust
    - binary_sensor.bathroom_motion_occupancy
    - binary_sensor.big_bedroom_motion_occupancy
    - binary_sensor.contactsensor_front_door
    - binary_sensor.sensor_motion_bedroom_1_motion
    - binary_sensor.motionsensor_kitchen_switchbot_plinth
    - binary_sensor.motionsensor_hal_switchbot_front_door
    - light.kitchen_lights_all
    - light.small_bed_lights_all
    - light.bathroom_lights_all
    - light.big_bedroom_light
    - light.dining_lights_all
    - light.eva_light
    - light.hal_lights_all
    - light.light_living_led_strip
    - light.yeelink_mono6_e86b_switch_status
    - light.yeelink_mono6_2ed7_light
    - light.eva_bedroom_light
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: light.kitchen_lights_all
        state: 'on'
      - condition: state
        entity_id:
        - binary_sensor.kitchen_motion_sensor
        - binary_sensor.motionsensor_hal_switchbot_plinth
        state: 'off'
        for: 00:15:00
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.kitchen_lights_all
    - conditions:
      - condition: state
        entity_id: light.small_bed_lights_all
        state: 'on'
      - condition: state
        entity_id:
        - binary_sensor.small_bedroom_motion_occupancy
        - binary_sensor.motionsensor_kitchen_exhaust
        state: 'off'
        for: 00:20:00
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.small_bed_lights_all
    - conditions:
      - condition: state
        entity_id: light.bathroom_lights_all
        state: 'on'
      - condition: state
        entity_id:
        - binary_sensor.bathroom_motion_occupancy
        - binary_sensor.motionsensor_kitchen_exhaust
        - binary_sensor.motionsensor_hal_switchbot_plinth
        state: 'off'
        for: 00:20:00
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.bathroom_lights_all
    - conditions:
      - condition: state
        entity_id: light.big_bedroom_light
        state: 'on'
      - condition: state
        entity_id:
        - binary_sensor.big_bedroom_motion_occupancy
        - binary_sensor.motionsensor_kitchen_exhaust
        state: 'off'
        for: 00:20:00
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.big_bedroom_light
    - conditions:
      - condition: state
        entity_id: light.dining_lights_all
        state: 'on'
      - condition: state
        entity_id: binary_sensor.contactsensor_front_door
        state: 'off'
        for: 00:15:00
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.dining_lights_all
    - conditions:
      - condition: time
        after: '23:00:00'
        before: '20:00:00'
      - condition: state
        entity_id:
        - light.eva_light
        - light.hal_lights_all
        state: 'on'
      - condition: state
        entity_id:
        - binary_sensor.motionsensor_hal_switchbot_plinth
        - binary_sensor.motionsensor_kitchen_exhaust
        state: 'off'
        for: 00:03:00
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.eva_light
          - light.hal_lights_all
    - conditions:
      - condition: state
        entity_id:
        - light.light_living_led_strip
        - light.yeelink_mono6_e86b_switch_status
        - light.yeelink_mono6_2ed7_light
        state: 'on'
      - condition: state
        entity_id:
        - binary_sensor.sensor_motion_bedroom_1_motion
        - binary_sensor.motionsensor_kitchen_switchbot_plinth
        state: 'off'
        for: 00:30:00
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.light_living_led_strip
          - light.yeelink_mono6_e86b_switch_status
          - light.yeelink_mono6_2ed7_light
    - conditions:
      - condition: state
        entity_id: light.eva_bedroom_light
        state: 'on'
      - condition: state
        entity_id:
        - binary_sensor.motionsensor_hal_switchbot_front_door
        - binary_sensor.motionsensor_hal_switchbot_plinth
        state: 'off'
        for: 00:20:00
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.eva_bedroom_light
  mode: parallel
  max: 10
