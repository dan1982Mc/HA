  triggers:
  - trigger: time
    at: '19:30:00'
  conditions: []
  actions:
  - action: calendar.get_events
    target:
      entity_id: calendar.eva_vacante
    data:
      start_date_time: '{{ (now() - timedelta(days=1)).strftime(''%Y-%m-%d'') }} 00:00:00

        '
      end_date_time: '{{ (now() + timedelta(days=8)).strftime(''%Y-%m-%d'') }} 23:59:59

        '
    response_variable: vacation_events
  - variables:
      today: '{{ now().date() }}'
      reminders: "{% set ns = namespace(items=[]) %} {% for event in vacation_events['calendar.eva_vacante'].events
        %}\n  {% set start = as_datetime(event.start).date() %}\n  {% set end = as_datetime(event.end).date()
        - timedelta(days=1) %}\n\n  {% if today == start - timedelta(days=7) %}\n
        \   {% set ns.items = ns.items + [\n      'Vacanța Evei începe peste 7 zile:
        ' ~ event.summary\n    ] %}\n  {% elif today == start - timedelta(days=3)
        %}\n    {% set ns.items = ns.items + [\n      'Vacanța Evei începe peste 3
        zile: ' ~ event.summary\n    ] %}\n  {% elif today == start - timedelta(days=1)
        %}\n    {% set ns.items = ns.items + [\n      'Vacanța Evei începe mâine:
        ' ~ event.summary\n    ] %}\n  {% elif today == end - timedelta(days=1) %}\n
        \   {% set ns.items = ns.items + [\n      'Vacanța Evei se termină mâine:
        ' ~ event.summary\n    ] %}\n  {% endif %}\n{% endfor %} {{ ns.items }}\n"
  - condition: template
    value_template: '{{ reminders | count > 0 }}'
  - action: media_player.volume_set
