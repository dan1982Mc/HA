- id: '1720729571359'
  alias: calendar events announcments get
  description: calendar_events_announcments is in the file usto_set_calendar_events.yaml
  trigger:
  - platform: time
    at: 07:00:00
    id: morning
  - platform: time
    at: '22:00:00'
    id: evening
  - platform: time_pattern
    minutes: /30
    id: next30minutes
  condition: []
  action:
  - if:
    - condition: trigger
      id: next30minutes
    - condition: time
      after: 05:59:00
      before: '22:35:00'
      weekday:
      - sun
      - mon
      - tue
      - wed
      - thu
      - fri
      - sat
    then:
    - service: script.calendar_events_announcments_agenda_get
      data:
        start_date_time: '{{ (now() | as_datetime + timedelta(minutes=59))  }}'
        end_date_time: '{{ (now() | as_datetime + timedelta(minutes=89))  }}'
        calendrier: calendar.thomas_example_com
        description: 'on'
        location: 'on'
      response_variable: resp_array
    - if:
      - condition: template
        value_template: '{{ resp_array|length > 0 }}'
      then:
      - if:
        - condition: state
          entity_id: input_boolean.notify_tts_prio_medium
          state: 'on'
        then:
        - service: script.turn_on
          entity_id: script.notify_tts_speak
          data:
            variables:
              volume: 0.5
              speakers: group.tts_notify_speaker_medium
              language: de-CH
              message: "Kommende Termine: {% for key, value in resp_array.items()
                %}\n  {%- if key[-5:] != \"00:00\" %}\n    {{- key[-5:] + \" \" +
                value }}\n  {%- else %}\n    {{ value }}  \n  {%- endif %}\n{% endfor
                %}"
      - if:
        - condition: state
          entity_id: input_boolean.notify_tv_prio_medium
          state: 'on'
        then:
        - service: notify.sony
          data:
            title: Kommende Termine
            message: "{% for key, value in resp_array.items() %}\n  {%- if key[-5:]
              != \"00:00\" %}\n    {{- key[-5:] + \" \" + value }}\n  {%- else %}\n
              \   {{ value }}  \n  {%- endif %}\n    {% endfor %}"
            data:
              fontsize: medium
              position: center
              duration: 15
              transparency: 0%
              color: indigo
              interrupt: 0
  - if:
    - condition: trigger
      id: morning
    then:
    - service: script.calendar_events_announcments_agenda_get
      data:
        start_date_time: '{% import ''date.jinja'' as dt %} {{ dt.today() }}'
        end_date_time: '{% import ''date.jinja'' as dt %} {{ dt.tomorrow() }}'
        calendrier: calendar.thomas_example_com
        description: 'off'
        location: 'on'
      response_variable: resp_array
    - if:
      - condition: template
        value_template: '{{ resp_array|length > 0 }}'
      then:
      - if:
        - condition: state
          entity_id: input_boolean.notify_tts_prio_medium
          state: 'on'
        then:
        - service: script.turn_on
          entity_id: script.notify_tts_speak
          data:
            variables:
              volume: 0.5
              speakers: group.tts_notify_speaker_medium
              language: de-CH
              message: "Termine von heute: {% for key, value in resp_array.items()
                %}\n  {%- if key[-5:] != \"00:00\" %}\n    {{- key[-5:] + \" \" +
                value }}\n  {%- else %}\n    {{ value }}  \n  {%- endif %}\n{% endfor
                %}"
      - if:
        - condition: state
          entity_id: input_boolean.notify_tv_prio_medium
          state: 'on'
        then:
        - service: notify.sony
          data:
            title: Heutige Termine
            message: "{% for key, value in resp_array.items() %}\n  {%- if key[-5:]
              != \"00:00\" %}\n    {{- key[-5:] + \" \" + value }}\n  {%- else %}\n
              \   {{ value }}  \n  {%- endif %}\n    {% endfor %}"
            data:
              fontsize: medium
              position: center
              duration: 15
              transparency: 0%
              color: indigo
              interrupt: 0
  - if:
    - condition: trigger
      id: evening
    then:
    - service: script.calendar_events_announcments_agenda_get
      data:
        start_date_time: '{% import ''date.jinja'' as dt %} {{ dt.tomorrow() }}'
        end_date_time: '{% import ''date.jinja'' as dt %} {{ dt.day_after_tomorrow()
          }}'
        calendrier: calendar.thomas_example_com
        description: 'off'
        location: 'on'
      response_variable: resp_array
    - if:
      - condition: template
        value_template: '{{ resp_array|length > 0 }}'
      then:
      - if:
        - condition: state
          entity_id: input_boolean.notify_tts_prio_medium
          state: 'on'
        then:
        - service: script.turn_on
          entity_id: script.notify_tts_speak
          data:
            variables:
              volume: 0.5
              speakers: group.tts_notify_speaker_medium
              language: de-CH
              message: "Termine von morgen: {% for key, value in resp_array.items()
                %}\n  {%- if key[-5:] != \"00:00\" %}\n    {{- key[-5:] + \" \" +
                value }}\n  {%- else %}\n    {{ value }}  \n  {%- endif %}\n{% endfor
                %}"
      - if:
        - condition: state
          entity_id: input_boolean.notify_tv_prio_medium
          state: 'on'
        then:
        - service: notify.sony
          data:
            title: Morgige Termine
            message: "{% for key, value in resp_array.items() %}\n  {%- if key[-5:]
              != \"00:00\" %}\n    {{- key[-5:] + \" \" + value }}\n  {%- else %}\n
              \   {{ value }}  \n  {%- endif %}\n    {% endfor %}"
            data:
              fontsize: medium
              position: center
              duration: 15
              transparency: 0%
              color: indigo
              interrupt: 0
  mode: single
