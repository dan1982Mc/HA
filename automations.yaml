- id: '1776190886594'
  alias: 'Kitchen Clock: Weather Alert for Dan - OLD '
  description: ''
  triggers:
  - at: 07:10:00
    trigger: time
  actions:
  - action: media_player.turn_on
    target:
      entity_id: media_player.kitchen_clock
  - action: tts.google_translate_say
    target:
      entity_id: media_player.kitchen_clock
    data:
      message: "{% set total_rain = states('sensor.buienalarm_precipitation_forecast_total')
        | float(0) %} {% set intensity = states('sensor.buienalarm_precipitation_forecast_average')
        | float(0) %} {% set next_rain = states('sensor.buienalarm_next_rain_forecast')
        %}\nGood morning. It is currently {{ states('weather.buienradar') }} in Voorburg.\n{%
        if total_rain > 0 %}\n  {% if next_rain not in ['unknown', 'unavailable',
        'None'] %}\n    Rain is expected to start in {{ ((as_timestamp(next_rain)
        - as_timestamp(now())) / 60) | int }} minutes.\n  {% else %}\n    Rain is
        expected shortly.\n  {% endif %}\n  \n  The intensity will be {{ intensity
        }} millimeters per hour.\n  \n  {# High probability/severity logic #}\n  {%
        if intensity > 2.5 or total_rain > 5 %}\n    The rain looks heavy. Dan, remember
        to put your rain suit on before you leave.\n  {% elif intensity > 0.5 %}\n
        \   It will be a steady rain. You might need a jacket.\n  {% endif %}\n{%
        else %}\n  The next two hours look completely dry. Have a great start to your
        day!\n{% endif %}\n"
  - delay: 00:00:02
  - wait_for_trigger:
    - entity_id: media_player.kitchen_clock
      from: playing
      to: idle
      trigger: state
    timeout: 00:00:30
  - action: media_player.media_stop
    target:
      entity_id: media_player.kitchen_clock
  - delay: 00:00:01
  - action: media_player.play_media
    target:
      entity_id: media_player.kitchen_clock
    data:
      media:
        media_content_id: "{% if state_attr('camera.buienradar', 'entity_picture')
          %}\n  {{ \"http://192.168.X.X:8123\" + state_attr('camera.buienradar', 'entity_picture')
          }}\n{% endif %}\n"
        media_content_type: image/png
        metadata: {}
- id: '1776191557318'
  alias: Kitchen Clock-Birthday Holiday - Notifications
  description: Reads out today's birthdays and holidays for today/tomorrow at 07:20
  triggers:
  - at: 07:20:00
    trigger: time
  actions:
  - action: calendar.get_events
    target:
      entity_id: calendar.zile_de_nastere
    data:
      duration:
        hours: 24
    response_variable: birthday_agenda
  - action: calendar.get_events
    target:
      entity_id:
      - calendar.holidays_in_netherlands
      - calendar.holidays_in_romania
    data:
      duration:
        hours: 48
    response_variable: holiday_agenda
  - variables:
      birthdays: '{{ birthday_agenda[''calendar.zile_de_nastere''].events | map(attribute=''summary'')
        | list }}'
      all_holidays: '{{ (holiday_agenda[''calendar.holidays_in_netherlands''].events
        + holiday_agenda[''calendar.holidays_in_romania''].events) }}'
      holidays_today: "{{ all_holidays | selectattr('start', 'search', now().strftime('%Y-%m-%d'))
        \n   | map(attribute='summary') | unique | list }}\n"
      holidays_tomorrow: "{{ all_holidays | selectattr('start', 'search', (now() +
        timedelta(days=1)).strftime('%Y-%m-%d')) \n   | map(attribute='summary') |
        unique | list }}\n"
  - action: tts.google_translate_say
    target:
      entity_id: media_player.kitchen_clock
    data:
      message: "Good morning! \n{# Birthdays Section #} {% if birthdays | count >
        0 %}\n  Today we have {% if birthdays | count == 1 %} a birthday: {{ birthdays[0]
        }}. {% else %} some birthdays: {{ birthdays[:-1] | join(', ') }} and {{ birthdays[-1]
        }}. {% endif %}\n{% endif %}\n{# Holidays Today #} {% if holidays_today |
        count > 0 %}\n  Today is {{ holidays_today | join(' and ') }}.\n{% endif %}\n{#
        Holidays Tomorrow #} {% if holidays_tomorrow | count > 0 %}\n  Tomorrow it
        will be {{ holidays_tomorrow | join(' and ') }}.\n{% endif %}\n{% if birthdays
        | count == 0 and holidays_today | count == 0 and holidays_tomorrow | count
        == 0 %}\n  There are no birthdays or holidays today or tomorrow.\n{% endif
        %}\n"
- id: '1776192843400'
  alias: 'Garden Watering: 3 Daily Sessions with Rain Skip'
  description: Water for 7 mins at 7:20, 13:30, 19:00. Skips sessions based on rain.
  triggers:
  - trigger: time
    at:
    - 07:15:00
    - '14:10:00'
    - '18:55:00'
  actions:
  - action: weather.get_forecasts
    data:
      type: daily
    target:
      entity_id: weather.buienradar
    response_variable: daily_forecast
  - variables:
      rain_today: '{{ daily_forecast[''weather.buienradar''].forecast[0].precipitation
        | float(0) }}'
      scheduled_time: '{{ (now() + timedelta(minutes=5)).strftime(''%H:%M'') }}'
  - if:
    - condition: template
      value_template: "{% if rain_today > 6 %}\n  false\n{% elif rain_today > 3 and
        scheduled_time in ['13:30', '19:00'] %}\n  false\n{% elif rain_today > 1 and
        scheduled_time == '13:30' %}\n  false\n{% else %}\n  true\n{% endif %}\n"
    then:
    - action: media_player.volume_set
      target:
        entity_id:
        - media_player.dan_s_echo_dot
        - media_player.2e_echo_dot_dan
        - media_player.kitchen_clock
      data:
        volume_level: 0.3
    - action: notify.alexa_media
      data:
        target:
        - media_player.dan_s_echo_dot
        - media_player.2e_echo_dot_dan
        data:
          type: announce
        message: Grass watering will start in 5 minutes. Stay inside the house!
    - action: tts.google_translate_say
      target:
        entity_id: media_player.kitchen_clock
      data:
        message: Grass watering will start in 5 minutes. Stay inside the house!
    - delay: 00:05:00
    - action: switch.turn_on
      target:
        entity_id: switch.water_valve
    - delay: 00:07:00
    - action: switch.turn_off
      target:
        entity_id: switch.water_valve
    else:
    - stop: Session skipped due to {{ rain_today }}mm of predicted rain.
