automation_disable_timed:
  alias: Temporarily Disable Automation
  description: Disable an automation for one hour or until midnight, then re-enable it.
  mode: parallel
  max: 20
  fields:
    automation_entity:
      name: Automation
      description: The automation to disable temporarily
      required: true
      selector:
        entity:
          domain: automation
    duration_mode:
      name: Duration
      required: true
      selector:
        select:
          options:
            - label: 1 hour
              value: hour
            - label: Until midnight
              value: tomorrow
  sequence:
    - action: automation.turn_off
      target:
        entity_id: "{{ automation_entity }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ duration_mode == 'hour' }}"
          sequence:
            - delay:
                hours: 1
        - conditions:
            - condition: template
              value_template: "{{ duration_mode == 'tomorrow' }}"
          sequence:
            - delay:
                seconds: "{{ [1, (as_timestamp(today_at('23:59:59')) - as_timestamp(now())) | int] | max }}"
    - action: automation.turn_on
      target:
        entity_id: "{{ automation_entity }}"
