kiosk_mode:
  user_settings:
    - users:
        - kiosktablet
      kiosk: true
button_card_templates:
  light_template:
    show_state: false
    show_icon: true
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: '[[[ return variables.var_name + '' Lights'' ]]]'
          size: normal
          content:
            type: vertical-stack
            cards: >-
              [[[ return variables.lights_list.map(light => ({ type: 'tile',
              entity: light, features: [{ type: 'light-brightness' }] })) ]]]
    hold_action:
      action: more-info
    double_tap_action:
      action: toggle
    styles:
      card:
        - border-radius: 12px
        - padding: 12px
        - aspect-ratio: 1/1
      grid:
        - grid-template-areas: '"i" "n"'
      name:
        - font-weight: bold
        - font-size: 14px
        - justify-self: middle
    state:
      - value: 'on'
        styles:
          card:
            - background-color: orange
          name:
            - color: white
          icon:
            - color: white
      - value:
          - unavailable
          - unknown
          - none
          - 'null'
        operator: in
        styles:
          card:
            - background-color: '#333333'
            - opacity: 0.5
          name:
            - color: '#ff4444'
          icon:
            - color: '#ff4444'
        icon: mdi:lightbulb-alert
  contact_template:
    show_state: false
    show_icon: true
    show_last_changed: true
    show_label: true
    styles:
      card:
        - border-radius: 12px
        - padding: 12px
        - aspect-ratio: 1/1
        - position: relative
        - background-color: |
            [[[
              const offline = ['unavailable', 'unknown', 'none', 'null'];
              if (offline.includes(entity.state) || !entity.state) return '#333333';
              
              if (entity.state === 'on') {
                const diffMinutes = (new Date() - new Date(entity.last_changed)) / 1000 / 60;
                if (diffMinutes <= 5) return '#f1c40f';  // Yellow
                if (diffMinutes <= 30) return '#e67e22'; // Orange
                return '#e74c3c';                        // Red
              }
              return 'var(--card-background-color, #1c1c1e)';
            ]]]
        - opacity: |
            [[[
              const offline = ['unavailable', 'unknown', 'none', 'null'];
              return (offline.includes(entity.state) || !entity.state) ? 0.5 : 1.0;
            ]]]
      icon:
        - width: 45%
        - position: absolute
        - top: 50%
        - left: 50%
        - transform: translate(-50%, -50%)
        - color: |
            [[[
              const offline = ['unavailable', 'unknown', 'none', 'null'];
              if (offline.includes(entity.state) || !entity.state) return '#888888';
              if (entity.state === 'on') return '#FFFFFF';
              return 'var(--primary-text-color)';
            ]]]
      name:
        - font-weight: bold
        - font-size: 12px
        - position: absolute
        - top: 10px
        - right: 10px
        - color: |
            [[[
              const offline = ['unavailable', 'unknown', 'none', 'null'];
              if (offline.includes(entity.state) || !entity.state) return '#888888';
              if (entity.state === 'on') return '#FFFFFF';
              return 'var(--primary-text-color)';
            ]]]
      label:
        - font-size: 10px
        - position: absolute
        - bottom: 10px
        - left: 50%
        - transform: translateX(-50%)
        - color: |
            [[[
              const offline = ['unavailable', 'unknown', 'none', 'null'];
              if (offline.includes(entity.state) || !entity.state) return '#888888';
              if (entity.state === 'on') return '#E0E0E0';
              return 'var(--secondary-text-color)';
            ]]]
    state:
      - value: unavailable
        icon: mdi:help-circle-outline
      - value: unknown
        icon: mdi:help-circle-outline
      - value: none
        icon: mdi:help-circle-outline
      - value: 'null'
        icon: mdi:help-circle-outline
  motion_template:
    show_state: false
    show_icon: true
    show_last_changed: true
    show_label: true
    styles:
      card:
        - border-radius: 12px
        - padding: 12px
        - aspect-ratio: 1/1
        - position: relative
        - background-color: |
            [[[
              const offline = ['unavailable', 'unknown', 'none', 'null'];
              if (offline.includes(entity.state) || !entity.state) return '#333333';
              
              if (entity.state === 'on') {
                const now = new Date();
                const lastChanged = new Date(entity.last_changed);
                const diffMinutes = Math.floor((now - lastChanged) / 1000 / 60);

                if (diffMinutes < 5) return '#3498db';   // 0-5 mins: Light Blue
                if (diffMinutes < 30) return '#1f3a60';  // 5-30 mins: Dark Blue
                return '#9b59b6';                        // 30+ mins: Light Purple
              }
              
              return 'var(--card-background-color, #1c1c1e)';
            ]]]
        - opacity: |
            [[[
              const offline = ['unavailable', 'unknown', 'none', 'null'];
              // If state is any of the offline strings, dim the card to 50%
              return (offline.includes(entity.state) || !entity.state) ? 0.5 : 1.0;
            ]]]
      icon:
        - width: 45%
        - position: absolute
        - top: 50%
        - left: 50%
        - transform: translate(-50%, -50%)
        - color: |
            [[[
              const offline = ['unavailable', 'unknown', 'none', 'null'];
              if (offline.includes(entity.state) || !entity.state) return '#888888';
              
              if (entity.state === 'on') return '#FFFFFF';
              return 'var(--primary-text-color)';
            ]]]
      name:
        - font-weight: bold
        - font-size: 12px
        - position: absolute
        - top: 10px
        - right: 10px
        - color: |
            [[[
              const offline = ['unavailable', 'unknown', 'none', 'null'];
              if (offline.includes(entity.state) || !entity.state) return '#888888';
              if (entity.state === 'on') return '#FFFFFF';
              return 'var(--primary-text-color)';
            ]]]
      label:
        - font-size: 10px
        - position: absolute
        - bottom: 10px
        - left: 50%
        - transform: translateX(-50%)
        - color: |
            [[[
              const offline = ['unavailable', 'unknown', 'none', 'null'];
              if (offline.includes(entity.state) || !entity.state) return '#888888';
              if (entity.state === 'on') return '#E0E0E0';
              return 'var(--secondary-text-color)';
            ]]]
    state:
      - value: 'on'
        icon: mdi:motion-sensor
      - value: 'off'
        icon: mdi:motion-sensor-off
      - value: unavailable
        icon: mdi:help-circle-outline
      - value: unknown
        icon: mdi:help-circle-outline
      - value: none
        icon: mdi:help-circle-outline
      - value: 'null'
        icon: mdi:help-circle-outline
  media_player_template:
    show_state: true
    show_icon: true
    styles:
      card:
        - border-radius: 12px
        - padding: 12px
        - aspect-ratio: 1/1
      grid:
        - grid-template-areas: '"i n" "s s"'
        - grid-template-columns: 1fr 2fr
        - grid-template-rows: 1fr 1fr
      name:
        - font-weight: bold
        - font-size: 12px
        - align-self: start
        - justify-self: start
      state:
        - font-size: 10px
        - align-self: end
        - justify-self: start
        - text-transform: capitalize
    state:
      - value: playing
        styles:
          card:
            - background-color: '#2980b9'
          icon:
            - color: white
          name:
            - color: white
          state:
            - color: '#d1d1d1'
      - value: buffering
        styles:
          card:
            - background-color: orange
      - value: 'off'
        styles:
          card:
            - background-color: '#333333'
            - opacity: 0.5
          icon:
            - color: '#888888'
          name:
            - color: '#888888'
      - value: unavailable
        styles:
          card:
            - background-color: '#333333'
            - opacity: 0.5
          name:
            - color: '#ff4444'
          icon:
            - color: '#ff4444'
  volume_cycle_template:
    template: light_template
    show_label: true
    label: |
      [[[ 
        let v = entity.attributes.volume_level;
        if (v === undefined) return '0%';
        return Math.round(v * 100) + '%';
      ]]]
    styles:
      icon:
        - color: |
            [[[
              let v = entity.attributes.volume_level;
              if (v <= 0.3) return '#2ecc71';
              if (v <= 0.6) return '#f1c40f';
              return '#e74c3c';
            ]]]
      label:
        - font-size: 11px
        - color: '#888888'
  media_icon_only:
    show_state: true
    show_name: true
    styles:
      card:
        - border-radius: 12px
        - padding: 12px
        - aspect-ratio: 1/1
      grid:
        - grid-template-areas: '"n" "i" "s"'
        - grid-template-rows: min-content 1fr min-content
        - grid-template-columns: 1fr
      name:
        - font-weight: bold
        - font-size: 12px
        - justify-self: end
        - color: white
      icon:
        - width: 40%
        - align-self: center
        - justify-self: center
      state:
        - justify-self: center
        - font-weight: bold
        - font-size: 11px
        - text-transform: capitalize
        - color: white
    state:
      - value: playing
        styles:
          card:
            - background-color: '#2980b9'
          icon:
            - color: white
          name:
            - color: white
          state:
            - color: white
      - value: 'off'
        styles:
          card:
            - background-color: '#333333'
            - opacity: 0.5
          icon:
            - color: '#888888'
          name:
            - color: white
            - opacity: 1
          state:
            - color: white
            - opacity: 1
      - value: idle
        styles:
          card:
            - background-color: '#2c2c2e'
          icon:
            - color: '#3498db'
          name:
            - color: white
            - opacity: 1
          state:
            - color: white
            - opacity: 1
      - value: unavailable
        styles:
          card:
            - background-color: '#333333'
            - opacity: 0.5
          name:
            - color: '#ff4444'
          icon:
            - color: '#ff4444'
          state:
            - color: '#ff4444'
  appliance_template:
    show_state: false
    show_icon: true
    show_label: true
    tap_action:
      action: more-info
    double_tap_action:
      action: toggle
    styles:
      card:
        - border-radius: 12px
        - padding: 12px
        - aspect-ratio: 1/1
        - animation: |
            [[[
              if (entity.state === 'run' || entity.state === 'cleaning' || entity.state === 'on') 
                return 'blink 3s ease-in-out infinite';
              return 'none';
            ]]]
      grid:
        - grid-template-areas: '"n" "i" "l"'
        - grid-template-rows: min-content 1fr min-content
      name:
        - font-weight: bold
        - font-size: 12px
        - justify-self: end
      icon:
        - width: 40%
        - align-self: center
        - justify-self: center
      label:
        - justify-self: center
        - font-weight: bold
        - font-size: 11px
    label: |
      [[[
        if (!entity) return "";

        // 1. Check if the appliance is currently running
        const isRunning = ['run', 'cleaning', 'on'].includes(entity.state);

        if (isRunning) {
          // 2. Calculate elapsed time using last_changed
          const startTime = new Date(entity.last_changed);
          const now = new Date();
          const diffMs = now - startTime;

          // 3. Convert milliseconds to Hours and Minutes
          const diffHrs = Math.floor(diffMs / 3600000);
          const diffMins = Math.floor((diffMs % 3600000) / 60000);

          // 4. Format the output string (e.g., "1h 15m" or "45m")
          let elapsedStr = "";
          if (diffHrs > 0) {
            elapsedStr += diffHrs + "h ";
          }
          elapsedStr += diffMins + "m";

          return "Running: " + elapsedStr;
        }

        // Fallback for when the machine is idle/off
        return "Ready";
      ]]]
  vacuum_template:
    show_state: false
    show_icon: true
    show_label: true
    styles:
      card:
        - border-radius: 12px
        - padding: 12px
        - aspect-ratio: 1/1
        - animation: |
            [[[
              if (entity.state === 'run' || entity.state === 'cleaning' || entity.state === 'on') 
                return 'blink 3s ease-in-out infinite';
              return 'none';
            ]]]
      grid:
        - grid-template-areas: '"n" "i" "l" "status"'
        - grid-template-rows: min-content 1fr min-content min-content
      name:
        - font-weight: bold
        - font-size: 12px
        - justify-self: end
      icon:
        - width: 40%
        - align-self: center
        - justify-self: center
      label:
        - justify-self: center
        - font-weight: bold
        - font-size: 11px
        - margin-bottom: 2px
      custom_fields:
        status:
          - justify-self: center
          - font-size: 10px
          - opacity: 0.6
          - text-transform: capitalize
    label: |
      [[[
        if (!entity || !entity.attributes) return "";
        const remain = entity.attributes.remaining_time || entity.attributes.time_remaining;
        return remain ? remain + " left" : "Ready";
      ]]]
    custom_fields:
      status: |
        [[[
          if (!entity) return "";
          let stateText = entity.state.replace(/_/g, ' ');
          return stateText;
        ]]]
  plug_appliance_template:
    update_interval: 1m
    show_state: false
    show_icon: true
    show_label: true
    tap_action:
      action: more-info
    double_tap_action:
      action: perform-action
      perform_action: homeassistant.toggle
      target:
        entity_id: '[[[ return entity.entity_id ]]]'
    lock:
      enabled: |
        [[[ 
          if (!variables.binary_sensor || !states[variables.binary_sensor]) return false;
          return states[variables.binary_sensor].state === 'on';
        ]]]
      duration: 3
    variables:
      power_sensor: ''
      binary_sensor: ''
    styles:
      card:
        - border-radius: 12px
        - padding: 12px
        - aspect-ratio: 1/1
        - animation: |
            [[[
              if (variables.binary_sensor && states[variables.binary_sensor]) {
                if (states[variables.binary_sensor].state === 'on') return 'blink 3s ease-in-out infinite';
                return 'none';
              }
              if (variables.power_sensor && states[variables.power_sensor]) {
                const current = Number(states[variables.power_sensor].state);
                return Number.isFinite(current) && current > 0.05 ? 'blink 3s ease-in-out infinite' : 'none';
              }
              return 'none';
            ]]]
      grid:
        - grid-template-areas: '"n" "i" "l"'
        - grid-template-rows: min-content 1fr min-content
      name:
        - font-weight: bold
        - font-size: 12px
        - justify-self: end
        - align-self: start
      icon:
        - width: 40%
        - align-self: center
        - justify-self: center
      label:
        - justify-self: center
        - font-weight: bold
        - font-size: 11px
    label: |
      [[[
        // Force UI updates via sensor.time clock synchronization
        const timeTrigger = states['sensor.time']?.state;

        let runEntity = null;
        if (variables.binary_sensor && states[variables.binary_sensor]) {
          if (states[variables.binary_sensor].state === 'on') runEntity = states[variables.binary_sensor];
        } else if (variables.power_sensor && states[variables.power_sensor]) {
          const current = Number(states[variables.power_sensor].state);
          if (Number.isFinite(current) && current > 0.05) runEntity = states[variables.power_sensor];
        }

        if (runEntity) {
          const startTime = new Date(runEntity.last_changed);
          const now = new Date();
          const diffMs = now - startTime;
          const diffHrs = Math.floor(diffMs / 3600000);
          const diffMins = Math.floor((diffMs % 3600000) / 60000);
          let elapsedStr = "";
          if (diffHrs > 0) elapsedStr += diffHrs + "h ";
          elapsedStr += diffMins + "m";
          return "Running: " + elapsedStr;
        }

        if (variables.binary_sensor && states[variables.binary_sensor]) return "Ready";
        if (variables.power_sensor && states[variables.power_sensor]) return "Standby";
        return "No Sensor";
      ]]]
  timer_dashboard_template:
    show_name: false
    show_icon: false
    show_state: false
    show_label: false
    update_timer: 1s
    triggers_update:
      - sensor.2e_echo_dot_dan_next_timer
      - sensor.dan_s_echo_dot_next_timer
      - timer.assistant_timer
    tap_action:
      action: none
    hold_action:
      action: none
    hidden: |
      [[[
        const now = Date.now();
        const hasEchoTimers = (entityId) => {
          const attrs = states[entityId]?.attributes || {};
          const records = Array.isArray(attrs.sorted_active) && attrs.sorted_active.length
            ? attrs.sorted_active
            : (Array.isArray(attrs.active) && attrs.active.length ? attrs.active : []);
          return records.some((timer) => {
            const status = String(timer.status || 'ON').toUpperCase();
            const end = Number(timer.triggerTime);
            const remaining = end > 0 ? end - now : Number(timer.remainingTime) || 0;
            return status === 'ON' && remaining > 0;
          });
        };
        const assist = states['timer.assistant_timer'];
        return !hasEchoTimers('sensor.2e_echo_dot_dan_next_timer')
          && !hasEchoTimers('sensor.dan_s_echo_dot_next_timer')
          && assist?.state !== 'active';
      ]]]
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 0
        - overflow: visible
      grid:
        - grid-template-areas: '"timers"'
        - grid-template-columns: 1fr
        - grid-template-rows: auto
      custom_fields:
        timers:
          - width: 100%
          - justify-self: stretch
          - align-self: stretch
    custom_fields:
      timers: |
        [[[
          const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (ch) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
          }[ch]));

          const getEchoTimers = (entityId, now) => {
            const attrs = states[entityId]?.attributes || {};
            const records = Array.isArray(attrs.sorted_active) && attrs.sorted_active.length
              ? attrs.sorted_active
              : (Array.isArray(attrs.active) && attrs.active.length
                ? attrs.active
                : (Array.isArray(attrs.all) ? attrs.all : []));
            return records.map((record) => {
              const end = Number(record.triggerTime);
              const remaining = end > 0 ? end - now : Number(record.remainingTime) || 0;
              return {
                record,
                remainingMs: remaining,
                durationMs: Number(record.originalDurationInMillis) || 0
              };
            }).filter((item) => {
              const status = String(item.record.status || 'ON').toUpperCase();
              return status === 'ON' && item.remainingMs > 0;
            });
          };

          const parseDurationMs = (value) => {
            const text = String(value || '').trim();
            const parts = text.split(':');
            if (parts.length === 3 && parts.every((part) => Number.isFinite(Number(part)))) {
              return ((Number(parts[0]) * 3600) + (Number(parts[1]) * 60) + Number(parts[2])) * 1000;
            }
            if (parts.length === 2 && parts.every((part) => Number.isFinite(Number(part)))) {
              return ((Number(parts[0]) * 60) + Number(parts[1])) * 1000;
            }
            const number = Number(value);
            return Number.isFinite(number) && number > 0 ? number * 1000 : 0;
          };

          const formatRemaining = (milliseconds) => {
            const seconds = Math.max(0, Math.ceil(milliseconds / 1000));
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            return hours > 0
              ? hours + ':' + String(minutes).padStart(2, '0') + ':' + String(secs).padStart(2, '0')
              : minutes + ':' + String(secs).padStart(2, '0');
          };

          const formatDuration = (milliseconds) => {
            const seconds = Math.max(0, Math.round(milliseconds / 1000));
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            if (hours > 0) return hours + 'h ' + (minutes > 0 ? minutes + 'm' : '');
            if (minutes > 0) return minutes + ' min' + (secs > 0 ? ' ' + secs + 's' : '');
            return secs + ' sec';
          };

          const renderTimerRow = (item, index, count, fallbackLabel) => {
            const record = item.record || {};
            const label = record.timerLabel || record.label || record.reminderLabel
              || record.reminderSubLabel || record.alarmLabel || fallbackLabel
              || (count === 1 ? 'Timer' : 'Timer ' + (index + 1));
            const remaining = Math.max(0, item.remainingMs);
            const duration = item.durationMs > 0 ? item.durationMs : Math.max(remaining, 1);
            const fraction = Math.max(0, Math.min(1, remaining / duration));
            const strokeOffset = 283 * (1 - fraction);
            const elapsedPercent = Math.round((1 - fraction) * 100);
            const timeText = formatRemaining(remaining);
            const fontSize = timeText.length > 5 ? 11 : (timeText.length > 4 ? 13 : 16);
            return ''
              + '<div style="display:flex;align-items:center;gap:10px;width:100%;padding:5px 0;box-sizing:border-box;">'
              +   '<svg viewBox="0 0 100 100" width="66" height="66" style="flex-shrink:0;display:block;">'
              +     '<circle cx="50" cy="50" r="45" fill="none" stroke="#333333" stroke-width="7"></circle>'
              +     '<circle cx="50" cy="50" r="45" fill="none" stroke="#2ecc71" stroke-width="7" stroke-dasharray="283" stroke-dashoffset="' + strokeOffset + '" stroke-linecap="round" transform="rotate(-90 50 50)"></circle>'
              +     '<text x="50" y="55" fill="var(--primary-text-color)" font-size="' + fontSize + '" font-weight="bold" text-anchor="middle">' + timeText + '</text>'
              +   '</svg>'
              +   '<div style="flex:1;min-width:0;">'
              +     '<div style="font-size:13px;font-weight:600;color:var(--primary-text-color);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(label) + '</div>'
              +     '<div style="font-size:11px;color:var(--secondary-text-color);margin-top:3px;">' + esc(formatDuration(duration)) + ' total</div>'
              +     '<div style="height:4px;background:#333333;border-radius:4px;overflow:hidden;margin-top:7px;">'
              +       '<div style="height:100%;width:' + elapsedPercent + '%;background:#2ecc71;transition:width 1s linear;"></div>'
              +     '</div>'
              +   '</div>'
              + '</div>';
          };

          const renderPanel = (title, timers, fallbackLabel) => {
            if (!timers.length) return '';
            return ''
              + '<div style="background:var(--ha-card-background,var(--card-background-color));border:1px solid var(--divider-color);border-radius:12px;padding:12px;min-width:0;box-sizing:border-box;">'
              +   '<div style="font-size:13px;font-weight:700;color:var(--primary-text-color);margin-bottom:6px;">' + esc(title) + '</div>'
              +   timers.map((timer, index) => renderTimerRow(timer, index, timers.length, fallbackLabel)).join('')
              + '</div>';
          };

          const now = Date.now();
          const panels = [];
          const livingTimers = getEchoTimers('sensor.2e_echo_dot_dan_next_timer', now);
          const evaTimers = getEchoTimers('sensor.dan_s_echo_dot_next_timer', now);
          const livingPanel = renderPanel('Living Room Alexa', livingTimers, null);
          const evaPanel = renderPanel("Eva's Alexa", evaTimers, null);
          if (livingPanel) panels.push(livingPanel);
          if (evaPanel) panels.push(evaPanel);

          const assist = states['timer.assistant_timer'];
          if (assist && assist.state === 'active') {
            const attrs = assist.attributes || {};
            const finish = Date.parse(attrs.finishes_at || '');
            const durationMs = parseDurationMs(attrs.duration);
            const remainingMs = Number.isFinite(finish)
              ? Math.max(0, finish - now)
              : parseDurationMs(attrs.remaining);
            if (remainingMs > 0) {
              panels.push(renderPanel('Assist Timer', [{
                record: { timerLabel: 'Running' },
                remainingMs,
                durationMs: durationMs || remainingMs
              }], 'Running'));
            }
          }

          if (!panels.length) return '';
          return ''
            + '<div style="width:100%;box-sizing:border-box;">'
            +   '<div style="font-size:16px;font-weight:700;color:var(--primary-text-color);margin:0 0 12px 0;">🔔 RUNNING TIMERS</div>'
            +   '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;width:100%;">'
            +     panels.join('')
            +   '</div>'
            + '</div>';
        ]]]
