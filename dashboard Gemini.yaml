                    - light.small_bed_light_2
                    - light.small_bed_light_3
      - type: grid
        cards:
          - type: heading
            heading: MEDIA & PLAYERS
          - type: grid
            columns: 2
            square: true
            cards:
              - type: custom:button-card
                entity: media_player.2e_echo_dot_dan
                template: media_icon_only
                name: Living room Alexa
                icon: mdi:waveform
                label: '[[[ return entity.state ]]]'
                tap_action:
                  action: call-service
                  service: media_player.volume_mute
                  service_data:
                    entity_id: media_player.2e_echo_dot_dan
                    is_volume_muted: '[[[ return !entity.attributes.is_volume_muted ]]]'
                double_tap_action:
                  action: more-info
                hold_action:
                  action: call-service
                  service: switch.toggle
                  service_data:
                    entity_id: switch.2e_echo_dot_dan_do_not_disturb_switch
              - type: custom:button-card
                entity: media_player.dan_s_echo_dot
                template: media_icon_only
                name: Eva Alexa
                icon: mdi:play-circle-outline
                label: '[[[ return entity.state ]]]'
                tap_action:
                  action: call-service
                  service: media_player.volume_mute
                  service_data:
                    entity_id: media_player.dan_s_echo_dot
                    is_volume_muted: '[[[ return !entity.attributes.is_volume_muted ]]]'
                double_tap_action:
                  action: more-info
                hold_action:
                  action: call-service
                  service: switch.toggle
