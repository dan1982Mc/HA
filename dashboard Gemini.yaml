                tap_action:
                  action: call-service
                  service: media_player.volume_mute
                  target:
                    entity_id: media_player.mibox_master_control
                  data:
                    is_volume_muted: toggle
                double_tap_action:
                  action: more-info
                hold_action:
                  action: call-service
                  service: media_player.toggle
                  target:
                    entity_id: media_player.mibox_master_control
      - type: grid
