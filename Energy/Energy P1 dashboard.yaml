                              Net = max(gross minus baseline, 0). Gross is always
                              recorded; baseline and net are only recorded after at
                              least 24 valid samples for each relevant mode.
                              Electricity samples are restricted to low-load periods
                              and exclude known washer, dryer, dishwasher and oven
                              activity. Gas baseline is split by thermostat heating
                              / idle state; unmarked gas use can still affect it.
                              Net is a household-level estimate, not an isolated
                              appliance measurement. Gas-meter resolution,
                              concurrent use and time-of-day differences limit
                              accuracy. The gross and net graphs are separate so
                              gross is never hidden by baseline subtraction.
