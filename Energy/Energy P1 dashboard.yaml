title: Energy Habits
views:
  - title: Energy
    path: energy-habits
    icon: mdi:home-lightning-bolt
    type: sections
    max_columns: 2
    dense_section_placement: false
    sections:
      - type: grid
        title: Household overview
        cards:
          - type: markdown
            content: |
              # Energy habits
    
              <span style="opacity:.65">Live power · monthly totals · household patterns</span>
          - type: grid
            columns: 3
            square: false
            cards:
              - type: tile
                entity: binary_sensor.energy_house_empty
                name: Home status
                icon: mdi:home-outline
                vertical: false
              - type: tile
                entity: sensor.slimmelezer_mini_power_consumed
                name: Grid power
                icon: mdi:lightning-bolt
                color: amber
                vertical: false
              - type: tile
                entity: climate.tstat_838e9c_lyric_t6_thermostat
                name: Heating
                icon: mdi:thermostat
                vertical: false
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:button-card
                entity: sensor.energy_cost_total_month
                name: Cost this month
                icon: mdi:currency-eur
                show_state: true
                show_label: false
                triggers_update:
                  - sensor.energy_cost_yoy_difference
                state_display: |
                  [[[
                    const value = Number(entity?.state);
                    return Number.isFinite(value) ? '€' + value.toFixed(2) : '—';
                  ]]]
                custom_fields:
                  comparison: |
                    [[[
                      const comp = states['sensor.energy_cost_yoy_difference'];
                      const difference = Number(comp?.state);
                      const percentage = Number(comp?.attributes?.percentage);
                      if (!Number.isFinite(difference) || !Number.isFinite(percentage)) {
                        return '<div style="display:flex;justify-content:space-between;width:100%;"><span>—</span><span>—</span></div>';
                      }
                      const color = difference < -0.000001
                        ? 'var(--success-color)'
                        : difference > 0.000001
                          ? 'var(--error-color)'
                          : 'var(--secondary-text-color)';
                      const delta = difference > 0 ? '+' : difference < 0 ? '−' : '';
                      const percent = percentage > 0 ? '+' : percentage < 0 ? '−' : '';
                      const left = delta + '€' + Math.abs(difference).toFixed(2);
                      const right = percent + Math.abs(percentage).toFixed(1) + '%';
                      return '<div style="display:flex;align-items:center;justify-content:space-between;width:100%;gap:6px;color:' + color + ';font-size:11px;font-weight:700;line-height:14px;">' +
                        '<span style="text-align:left;">' + left + '</span>' +
                        '<span style="text-align:right;">' + right + '</span>' +
                        '</div>';
                    ]]]
                tap_action:
                  action: more-info
                styles:
                  card:
                    - min-height: 110px
                    - border-radius: 14px
                    - padding: 10px 12px
                  grid:
                    - grid-template-areas: '"i n" "i s" "comparison comparison"'
                    - grid-template-columns: 34px minmax(0, 1fr)
                    - grid-template-rows: min-content min-content min-content
                    - row-gap: 3px
                  icon:
                    - width: 26px
                  name:
                    - justify-self: start
                    - font-size: 12px
                    - font-weight: 600
                  state:
                    - justify-self: start
                    - font-size: 25px
                    - line-height: 1.2
                    - font-weight: 700
                  custom_fields:
                    comparison:
                      - width: 100%
                      - justify-self: stretch
                      - align-self: end
              - type: custom:button-card
                entity: sensor.energy_electricity_total_month
                name: Electricity this month
                icon: mdi:lightning-bolt
                show_state: true
                show_label: false
                triggers_update:
                  - sensor.energy_electricity_yoy_difference
                state_display: |
                  [[[
                    const value = Number(entity?.state);
                    return Number.isFinite(value) ? value.toFixed(1) + ' kWh' : '—';
                  ]]]
                custom_fields:
                  comparison: |
                    [[[
                      const comp = states['sensor.energy_electricity_yoy_difference'];
                      const difference = Number(comp?.state);
                      const percentage = Number(comp?.attributes?.percentage);
                      if (!Number.isFinite(difference) || !Number.isFinite(percentage)) {
                        return '<div style="display:flex;justify-content:space-between;width:100%;"><span>—</span><span>—</span></div>';
                      }
                      const color = difference < -0.000001
                        ? 'var(--success-color)'
                        : difference > 0.000001
                          ? 'var(--error-color)'
                          : 'var(--secondary-text-color)';
                      const delta = difference > 0 ? '+' : difference < 0 ? '−' : '';
                      const percent = percentage > 0 ? '+' : percentage < 0 ? '−' : '';
                      const left = delta + Math.abs(difference).toFixed(1) + ' kWh';
                      const right = percent + Math.abs(percentage).toFixed(1) + '%';
                      return '<div style="display:flex;align-items:center;justify-content:space-between;width:100%;gap:6px;color:' + color + ';font-size:11px;font-weight:700;line-height:14px;">' +
                        '<span style="text-align:left;">' + left + '</span>' +
                        '<span style="text-align:right;">' + right + '</span>' +
                        '</div>';
                    ]]]
                tap_action:
                  action: more-info
                styles:
                  card:
                    - min-height: 110px
                    - border-radius: 14px
                    - padding: 10px 12px
                  grid:
                    - grid-template-areas: '"i n" "i s" "comparison comparison"'
                    - grid-template-columns: 34px minmax(0, 1fr)
                    - grid-template-rows: min-content min-content min-content
                    - row-gap: 3px
                  icon:
                    - width: 26px
                  name:
                    - justify-self: start
                    - font-size: 12px
                    - font-weight: 600
                  state:
                    - justify-self: start
                    - font-size: 25px
                    - line-height: 1.2
                    - font-weight: 700
                  custom_fields:
                    comparison:
                      - width: 100%
                      - justify-self: stretch
                      - align-self: end
              - type: custom:button-card
                entity: sensor.energy_gas_total_month
                name: Gas this month
                icon: mdi:fire
                show_state: true
                show_label: false
                triggers_update:
                  - sensor.energy_gas_yoy_difference
                state_display: |
                  [[[
                    const value = Number(entity?.state);
                    return Number.isFinite(value) ? value.toFixed(2) + ' m³' : '—';
                  ]]]
                custom_fields:
                  comparison: |
                    [[[
                      const comp = states['sensor.energy_gas_yoy_difference'];
                      const difference = Number(comp?.state);
                      const percentage = Number(comp?.attributes?.percentage);
                      if (!Number.isFinite(difference) || !Number.isFinite(percentage)) {
                        return '<div style="display:flex;justify-content:space-between;width:100%;"><span>—</span><span>—</span></div>';
                      }
                      const color = difference < -0.000001
                        ? 'var(--success-color)'
                        : difference > 0.000001
                          ? 'var(--error-color)'
                          : 'var(--secondary-text-color)';
                      const delta = difference > 0 ? '+' : difference < 0 ? '−' : '';
                      const percent = percentage > 0 ? '+' : percentage < 0 ? '−' : '';
                      const left = delta + Math.abs(difference).toFixed(2) + ' m³';
                      const right = percent + Math.abs(percentage).toFixed(1) + '%';
                      return '<div style="display:flex;align-items:center;justify-content:space-between;width:100%;gap:6px;color:' + color + ';font-size:11px;font-weight:700;line-height:14px;">' +
                        '<span style="text-align:left;">' + left + '</span>' +
                        '<span style="text-align:right;">' + right + '</span>' +
                        '</div>';
                    ]]]
                tap_action:
                  action: more-info
                styles:
                  card:
                    - min-height: 110px
                    - border-radius: 14px
                    - padding: 10px 12px
                  grid:
                    - grid-template-areas: '"i n" "i s" "comparison comparison"'
                    - grid-template-columns: 34px minmax(0, 1fr)
                    - grid-template-rows: min-content min-content min-content
                    - row-gap: 3px
                  icon:
                    - width: 26px
                  name:
                    - justify-self: start
                    - font-size: 12px
                    - font-weight: 600
                  state:
                    - justify-self: start
                    - font-size: 25px
                    - line-height: 1.2
                    - font-weight: 700
                  custom_fields:
                    comparison:
                      - width: 100%
                      - justify-self: stretch
                      - align-self: end

          - type: custom:button-card
            entity: sensor.energy_gas_total_month
            name: Gas use split this month
            icon: mdi:fire
            show_state: false
            show_label: true
            triggers_update:
              - sensor.energy_gas_total_month
              - sensor.energy_gas_heating_time_weighted_month
              - sensor.energy_gas_other_time_weighted_month
            label: |
              [[[
                const total = Number(states['sensor.energy_gas_total_month']?.state);
                const heating = Number(states['sensor.energy_gas_heating_time_weighted_month']?.state);
                const other = Number(states['sensor.energy_gas_other_time_weighted_month']?.state);
                if (!Number.isFinite(total) || !Number.isFinite(heating) || !Number.isFinite(other)) {
                  return 'Waiting for monthly gas readings';
                }
                const safeTotal = Math.max(total, 0);
                const safeHeating = Math.min(Math.max(heating, 0), safeTotal);
                const safeOther = Math.min(Math.max(other, 0), Math.max(safeTotal - safeHeating, 0));
                const unallocated = Math.max(safeTotal - safeHeating - safeOther, 0);
                const heatingPct = safeTotal > 0 ? safeHeating / safeTotal * 100 : 0;
                const otherPct = safeTotal > 0 ? safeOther / safeTotal * 100 : 0;
                const unallocatedPct = safeTotal > 0 ? unallocated / safeTotal * 100 : 0;
                const unallocatedLabel = unallocated >= 0.005
                  ? ` &nbsp; <span style="color:#b8b8b8;font-weight:600">Unallocated ${unallocated.toFixed(2)} m³ · ${unallocatedPct.toFixed(0)}%</span>`
                  : '';
                return `<span style="color:var(--warning-color);font-weight:600">Heating ${safeHeating.toFixed(2)} m³ · ${heatingPct.toFixed(0)}%</span> &nbsp; <span style="color:var(--info-color);font-weight:600">Other ${safeOther.toFixed(2)} m³ · ${otherPct.toFixed(0)}%</span>` + unallocatedLabel;
              ]]]
            custom_fields:
              gas_bar: |
                [[[
                  const total = Number(states['sensor.energy_gas_total_month']?.state);
                  const heating = Number(states['sensor.energy_gas_heating_time_weighted_month']?.state);
                  const other = Number(states['sensor.energy_gas_other_time_weighted_month']?.state);
                  if (!Number.isFinite(total) || !Number.isFinite(heating) || !Number.isFinite(other) || total <= 0) {
                    return '<div style="height:12px;width:100%;border-radius:999px;background:var(--divider-color);"></div>';
                  }
                  const safeTotal = Math.max(total, 0);
                  const safeHeating = Math.min(Math.max(heating, 0), safeTotal);
                  const safeOther = Math.min(Math.max(other, 0), Math.max(safeTotal - safeHeating, 0));
                  const heatingEnd = Math.min(100, safeHeating / safeTotal * 100);
                  const otherEnd = Math.min(100, (safeHeating + safeOther) / safeTotal * 100);
                  return `<div style="height:12px;width:100%;border-radius:999px;background:linear-gradient(90deg,var(--warning-color) 0%,var(--warning-color) ${heatingEnd}%,var(--info-color) ${heatingEnd}%,var(--info-color) ${otherEnd}%,#b8b8b8 ${otherEnd}%,#b8b8b8 100%);"></div>`;
                ]]]
            styles:
              card:
                - min-height: 76px
                - border-radius: 14px
                - padding: 12px
              grid:
                - grid-template-areas: '"i n" "gas_bar gas_bar" "l l"'
                - grid-template-columns: 36px 1fr
                - grid-template-rows: min-content 14px min-content
                - row-gap: 7px
              icon:
                - width: 24px
              name:
                - justify-self: start
                - font-size: 13px
                - font-weight: 600
              custom_fields:
                gas_bar:
                  - width: 100%
                  - align-self: center
              label:
                - justify-self: start
                - text-align: left
                - white-space: normal
                - font-size: 11px
                - opacity: 0.9
          - type: custom:button-card
            entity: input_boolean.energy_shower_auto_active
            name: Automatic shower gas tracking
            icon: mdi:shower
            show_state: false
            show_label: true
            triggers_update:
              - sensor.energy_gas_shower_month
              - sensor.energy_gas_shower_week
              - binary_sensor.energy_shower_start_conditions_met
              - input_boolean.energy_shower_auto_active
              - sensor.thermometer_living_humidity
              - light.bathroom_lights_all
              - binary_sensor.bathroom_door_contact
            label: |
              [[[
                const month = Number(states['sensor.energy_gas_shower_month']?.state);
                const week = Number(states['sensor.energy_gas_shower_week']?.state);
                const fmt = (v) => Number.isFinite(v) ? v.toFixed(3) + ' m³' : '—';
                const conditions = states['binary_sensor.energy_shower_start_conditions_met']?.state;
                const humidity = states['sensor.thermometer_living_humidity']?.state || '—';
                if (entity?.state === 'on') {
                  return 'SHOWER DETECTED · ' + humidity + '% humidity';
                }
                return (conditions === 'on' ? 'START CONDITIONS MET' : 'WAITING FOR START CONDITIONS') +
                  ' · ' + humidity + '% humidity · month ' + fmt(month) + ' · week ' + fmt(week);
              ]]]
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: Automatic shower gas tracking
                  size: normal
                  content:
                    type: vertical-stack
                    cards:
                      - type: entities
                        title: Detection conditions
                        show_header_toggle: false
                        entities:
                          - entity: input_boolean.energy_shower_auto_active
                            name: Shower detected / session active
                          - entity: binary_sensor.energy_shower_start_conditions_met
                            name: All three start conditions met
                          - entity: sensor.thermometer_living_humidity
                            name: Bathroom humidity
                          - entity: light.bathroom_lights_all
                            name: Bathroom lights
                          - entity: binary_sensor.bathroom_door_contact
                            name: Bathroom door contact
                      - type: markdown
                        content: >-
                          **Start:** humidity strictly above 85% AND bathroom lights
                          ON AND bathroom door contact OFF (closed). All three must
                          be true together. The start automation checks when any
                          input changes and also rechecks once per minute.

                          **Stop:** bathroom lights OFF continuously for one minute.
                          Optional fallback: door contact ON (open) for two minutes
                          AND humidity below 85%. The door does not need to open
                          when the lights-off condition occurs.

                          **How to verify:** open Developer Tools → States and watch
                          the three input entities and
                          binary_sensor.energy_shower_start_conditions_met. When
                          all three start conditions are true, that diagnostic
                          sensor should turn ON and input_boolean.energy_shower_auto_active
                          should turn ON within about one minute. The popup's logbook
                          should then show “Automatic shower detection started”.
                          When an end condition occurs, the helper should turn OFF
                          and the logbook should show “Automatic shower detection ended”.

                          Check Settings → Automations & Scenes to confirm both
                          “Energy - Auto-detect shower start” and
                          “Energy - Auto-detect shower end” are enabled.

                          The shower gas estimate increases only when the gas meter
                          registers a positive update, which may be roughly hourly.

                      - type: entities
                        title: Estimated shower gas use
                        show_header_toggle: false
                        entities:
                          - entity: sensor.slimmelezer_gas_shower_time_weighted
                            name: All-time shower gas estimate · m³
                          - entity: sensor.energy_gas_shower_month
                            name: This month · m³
                          - entity: sensor.energy_gas_shower_cost_this_month
                            name: This month · estimated cost
                          - entity: sensor.energy_gas_shower_week
                            name: This calendar week · m³
                          - entity: sensor.energy_gas_shower_cost_this_week
                            name: This calendar week · estimated cost
                          - entity: sensor.energy_shower_runtime_this_month
                            name: Shower runtime this month · hours
                          - entity: sensor.energy_shower_sessions_this_month
                            name: Sessions this month
                          - entity: sensor.energy_shower_runtime_last_7_days
                            name: Shower runtime · rolling 7 days
                          - entity: sensor.energy_shower_sessions_last_7_days
                            name: Sessions · rolling 7 days
                      - type: statistics-graph
                        title: Estimated shower gas · daily · last 7 days
                        chart_type: bar
                        period: day
                        days_to_show: 7
                        stat_types:
                          - change
                        entities:
                          - entity: sensor.slimmelezer_gas_shower_time_weighted
                            name: Estimated shower gas
                      - type: statistics-graph
                        title: Actual P1 gas use · daily · last 7 days
                        chart_type: bar
                        period: day
                        days_to_show: 7
                        stat_types:
                          - change
                        entities:
                          - entity: sensor.slimmelezer_mini_gas_consumed
                            name: Total gas from P1
                      - type: history-graph
                        title: Shower detection signals · last 7 days
                        hours_to_show: 168
                        entities:
                          - entity: sensor.thermometer_living_humidity
                            name: Humidity
                          - entity: light.bathroom_lights_all
                            name: Bathroom lights
                          - entity: binary_sensor.bathroom_door_contact
                            name: Bathroom door
                      - type: logbook
                        title: Automatically detected showers
                        hours_to_show: 168
                        entities:
                          - entity: input_boolean.energy_shower_auto_active
                      - type: markdown
                        content: >-
                          A shower starts when humidity is above 85%, the bathroom
                          lights are on, and the door contact is closed (off).
                          It ends after the lights are off for one minute. The door
                          can also end it as a fallback after it has been open for
                          two minutes and humidity is below 85%.

                          Gas is estimated by assigning the share of each gas-meter
                          interval that overlapped a detected shower. The gas meter
                          refreshes roughly hourly, so this assumes gas flow was
                          uniform during that interval. The shower figure is an
                          estimate and overlaps the heating/idle gas classification;
                          do not add it to those categories.

                          The historic P1 gas and humidity/light/door graphs can show
                          the last seven days if Recorder retained them. The new
                          automatic shower marker and shower-gas estimate start
                          when this package is activated; they cannot recreate
                          past shower sessions automatically.
            styles:
              card:
                - min-height: 70px
                - border-radius: 14px
                - padding: 12px
              grid:
                - grid-template-areas: '"i n" "i l"'
                - grid-template-columns: 42px 1fr
              icon:
                - width: 28px
              name:
                - justify-self: start
                - font-size: 14px
                - font-weight: 700
              label:
                - justify-self: start
                - white-space: normal
                - text-align: left
                - font-size: 11px
                - opacity: 0.8
          - type: custom:button-card
            entity: input_boolean.energy_manual_activity_running
            name: |
              [[[
                return entity.state === 'on' ? 'STOP CURRENT ACTIVITY' : 'NO ACTIVITY RUNNING';
              ]]]
            icon: mdi:timer-stop-outline
            show_state: false
            show_label: true
            triggers_update:
              - input_text.energy_manual_activity_name
              - input_select.energy_manual_energy_source
              - sensor.energy_manual_activity_elapsed
            label: |
              [[[
                const name = states['input_text.energy_manual_activity_name']?.state || 'Activity';
                const source = states['input_select.energy_manual_energy_source']?.state || '';
                const elapsed = states['sensor.energy_manual_activity_elapsed']?.state || '0';
                return entity.state === 'on'
                  ? `${name} · ${source} · ${elapsed} min elapsed · tap to stop and record`
                  : 'Choose an activity below. Stop records meter change and elapsed time.';
              ]]]
            tap_action:
              action: call-service
              service: script.energy_manual_activity_stop
            state:
              - value: 'on'
                styles:
                  card:
                    - background: rgba(220, 70, 70, 0.16)
                    - border: 1px solid var(--error-color)
                  icon:
                    - color: var(--error-color)
                  name:
                    - color: var(--error-color)
              - value: 'off'
                styles:
                  card:
                    - background: var(--ha-card-background)
            styles:
              card:
                - min-height: 70px
                - border-radius: 14px
                - padding: 12px
              grid:
                - grid-template-areas: '"i n" "i l"'
                - grid-template-columns: 42px 1fr
                - grid-template-rows: min-content min-content
              icon:
                - width: 28px
              name:
                - justify-self: start
                - font-size: 14px
                - font-weight: 700
              label:
                - justify-self: start
                - white-space: normal
                - text-align: left
                - font-size: 11px
                - opacity: 0.8
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:button-card
                entity: input_boolean.energy_manual_activity_running
                name: Shower
                icon: mdi:shower
                show_state: false
                show_label: true
                triggers_update:
                  - input_select.energy_manual_activity_type
                  - sensor.energy_manual_activity_elapsed
                label: |
                  [[[
                    return entity.state === 'on' && states['input_select.energy_manual_activity_type']?.state === 'Shower'
                      ? `RUNNING · ${states['sensor.energy_manual_activity_elapsed']?.state || 0} min`
                      : 'Start gas session';
                  ]]]
                tap_action:
                  action: call-service
                  service: script.energy_start_shower
                styles:
                  card:
                    - min-height: 66px
                    - border-radius: 12px
                    - padding: 8px
                  icon:
                    - width: 24px
                  name:
                    - font-weight: 600
                    - font-size: 13px
                  label:
                    - font-size: 10px
                    - white-space: normal
                state:
                  - operator: template
                    value: >-
                      [[[ return entity.state === 'on' &&
                      states['input_select.energy_manual_activity_type']?.state ===
                      'Shower'; ]]]
                    styles:
                      card:
                        - background: rgba(30, 160, 110, 0.16)
                      icon:
                        - color: var(--success-color)
              - type: custom:button-card
                entity: input_boolean.energy_manual_activity_running
                name: Gas cooking
                icon: mdi:pot-steam
                show_state: false
                show_label: true
                triggers_update:
                  - input_select.energy_manual_activity_type
                  - sensor.energy_manual_activity_elapsed
                label: |
                  [[[
                    return entity.state === 'on' && states['input_select.energy_manual_activity_type']?.state === 'Gas cooking'
                      ? `RUNNING · ${states['sensor.energy_manual_activity_elapsed']?.state || 0} min`
                      : 'Start gas session';
                  ]]]
                tap_action:
                  action: call-service
                  service: script.energy_start_gas_cooking
                styles:
                  card:
                    - min-height: 66px
                    - border-radius: 12px
                    - padding: 8px
                  icon:
                    - width: 24px
                  name:
                    - font-weight: 600
                    - font-size: 13px
                  label:
                    - font-size: 10px
                    - white-space: normal
                state:
                  - operator: template
                    value: >-
                      [[[ return entity.state === 'on' &&
                      states['input_select.energy_manual_activity_type']?.state ===
                      'Gas cooking'; ]]]
                    styles:
                      card:
                        - background: rgba(30, 160, 110, 0.16)
                      icon:
                        - color: var(--success-color)
              - type: custom:button-card
                entity: input_boolean.energy_manual_activity_running
                name: Electric cooking
                icon: mdi:stove
                show_state: false
                show_label: true
                triggers_update:
                  - input_select.energy_manual_activity_type
                  - sensor.energy_manual_activity_elapsed
                label: |
                  [[[
                    return entity.state === 'on' && states['input_select.energy_manual_activity_type']?.state === 'Electric cooking'
                      ? `RUNNING · ${states['sensor.energy_manual_activity_elapsed']?.state || 0} min`
                      : 'Start electricity session';
                  ]]]
                tap_action:
                  action: call-service
                  service: script.energy_start_electric_cooking
                styles:
                  card:
                    - min-height: 66px
                    - border-radius: 12px
                    - padding: 8px
                  icon:
                    - width: 24px
                  name:
                    - font-weight: 600
                    - font-size: 13px
                  label:
                    - font-size: 10px
                    - white-space: normal
                state:
                  - operator: template
                    value: >-
                      [[[ return entity.state === 'on' &&
                      states['input_select.energy_manual_activity_type']?.state ===
                      'Electric cooking'; ]]]
                    styles:
                      card:
                        - background: rgba(30, 160, 110, 0.16)
                      icon:
                        - color: var(--success-color)
          - type: entities
            title: Other activity
            show_header_toggle: false
            entities:
              - entity: input_text.energy_manual_activity_name
                name: Activity name
              - entity: input_select.energy_manual_energy_source
                name: Energy source
