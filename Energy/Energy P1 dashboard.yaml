title: Energy Habits
views:
  - title: Energy
    path: energy-habits
    icon: mdi:home-lightning-bolt
    type: sections
    max_columns: 2
    dense_section_placement: false
    sections:
      - type: grid
        title: Household overview
        cards:
          - type: markdown
            content: |
              # Energy habits
    
              <span style="opacity:.65">Live power · monthly totals · household patterns</span>
          - type: grid
            columns: 3
            square: false
            cards:
              - type: tile
                entity: binary_sensor.energy_house_empty
                name: Home status
                icon: mdi:home-outline
                vertical: false
              - type: tile
                entity: sensor.slimmelezer_mini_power_consumed
                name: Grid power
                icon: mdi:lightning-bolt
                color: amber
                vertical: false
              - type: tile
                entity: climate.tstat_838e9c_lyric_t6_thermostat
                name: Heating
                icon: mdi:thermostat
                vertical: false
          - type: grid
            columns: 3
            square: false
            cards:
              - type: statistic
                entity: sensor.slimmelezer_energy_cost_total
                name: Cost this month
                stat_type: change
                period:
                  calendar:
                    period: month
              - type: statistic
                entity: sensor.slimmelezer_electricity_total
                name: Electricity this month
                stat_type: change
                period:
                  calendar:
                    period: month
              - type: statistic
                entity: sensor.slimmelezer_mini_gas_consumed
                name: Gas this month
                stat_type: change
                period:
                  calendar:
                    period: month
          - type: custom:button-card
            entity: sensor.energy_gas_total_month
            name: Gas use split this month
            icon: mdi:fire
            show_state: false
            show_label: true
            triggers_update:
              - sensor.energy_gas_total_month
              - sensor.energy_gas_heating_time_weighted_month
            label: |
              [[[
                const total = Number(states['sensor.energy_gas_total_month']?.state);
                const heating = Number(states['sensor.energy_gas_heating_time_weighted_month']?.state);
                if (!Number.isFinite(total) || !Number.isFinite(heating)) {
                  return 'Waiting for monthly gas readings';
                }
                const safeTotal = Math.max(total, 0);
                const safeHeating = Math.min(Math.max(heating, 0), safeTotal);
                const other = Math.max(safeTotal - safeHeating, 0);
                const heatingPct = safeTotal > 0 ? safeHeating / safeTotal * 100 : 0;
                const otherPct = safeTotal > 0 ? other / safeTotal * 100 : 0;
                return `<span style="color:var(--warning-color);font-weight:600">Heating ${heatingPct.toFixed(0)}% · ${safeHeating.toFixed(2)} m³</span> &nbsp; <span style="color:var(--info-color);font-weight:600">Other / unknown ${otherPct.toFixed(0)}% · ${other.toFixed(2)} m³</span>`;
              ]]]
            custom_fields:
              gas_bar: |
                [[[
                  const total = Number(states['sensor.energy_gas_total_month']?.state);
                  const heating = Number(states['sensor.energy_gas_heating_time_weighted_month']?.state);
                  if (!Number.isFinite(total) || !Number.isFinite(heating) || total <= 0) {
                    return '<div style="height:12px;width:100%;border-radius:999px;background:var(--divider-color);"></div>';
                  }
                  const share = Math.min(100, Math.max(0, heating / total * 100));
                  return `<div style="height:12px;width:100%;border-radius:999px;background:linear-gradient(90deg,var(--warning-color) 0%,var(--warning-color) ${share}%,var(--info-color) ${share}%,var(--info-color) 100%);"></div>`;
                ]]]
            styles:
              card:
                - min-height: 76px
                - border-radius: 14px
                - padding: 12px
              grid:
                - grid-template-areas: '"i n" "gas_bar gas_bar" "l l"'
                - grid-template-columns: 36px 1fr
                - grid-template-rows: min-content 14px min-content
                - row-gap: 7px
              icon:
                - width: 24px
              name:
                - justify-self: start
                - font-size: 13px
                - font-weight: 600
              custom_fields:
                gas_bar:
                  - width: 100%
                  - align-self: center
              label:
                - justify-self: start
                - text-align: left
                - white-space: normal
                - font-size: 11px
                - opacity: 0.9
          - type: custom:button-card
            entity: input_boolean.energy_manual_activity_running
            name: |
              [[[
                return entity.state === 'on' ? 'STOP CURRENT ACTIVITY' : 'NO ACTIVITY RUNNING';
              ]]]
            icon: mdi:timer-stop-outline
            show_state: false
            show_label: true
            triggers_update:
              - input_text.energy_manual_activity_name
              - input_select.energy_manual_energy_source
              - sensor.energy_manual_activity_elapsed
            label: |
              [[[
                const name = states['input_text.energy_manual_activity_name']?.state || 'Activity';
                const source = states['input_select.energy_manual_energy_source']?.state || '';
                const elapsed = states['sensor.energy_manual_activity_elapsed']?.state || '0';
                return entity.state === 'on'
                  ? `${name} · ${source} · ${elapsed} min elapsed · tap to stop and record`
                  : 'Choose an activity below. Stop records meter change and elapsed time.';
              ]]]
            tap_action:
              action: call-service
              service: script.energy_manual_activity_stop
            state:
              - value: 'on'
                styles:
                  card:
                    - background: rgba(220, 70, 70, 0.16)
                    - border: 1px solid var(--error-color)
                  icon:
                    - color: var(--error-color)
                  name:
                    - color: var(--error-color)
              - value: 'off'
                styles:
                  card:
                    - background: var(--ha-card-background)
            styles:
              card:
                - min-height: 70px
                - border-radius: 14px
                - padding: 12px
              grid:
                - grid-template-areas: '"i n" "i l"'
                - grid-template-columns: 42px 1fr
                - grid-template-rows: min-content min-content
              icon:
                - width: 28px
              name:
                - justify-self: start
                - font-size: 14px
                - font-weight: 700
              label:
                - justify-self: start
                - white-space: normal
                - text-align: left
                - font-size: 11px
                - opacity: 0.8
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:button-card
                entity: input_boolean.energy_manual_activity_running
                name: Shower
                icon: mdi:shower
                show_state: false
                show_label: true
                triggers_update:
                  - input_select.energy_manual_activity_type
                  - sensor.energy_manual_activity_elapsed
                label: |
                  [[[
                    return entity.state === 'on' && states['input_select.energy_manual_activity_type']?.state === 'Shower'
                      ? `RUNNING · ${states['sensor.energy_manual_activity_elapsed']?.state || 0} min`
                      : 'Start gas session';
                  ]]]
                tap_action:
                  action: call-service
                  service: script.energy_start_shower
                styles:
                  card:
                    - min-height: 66px
                    - border-radius: 12px
                    - padding: 8px
                  icon:
                    - width: 24px
                  name:
                    - font-weight: 600
                    - font-size: 13px
                  label:
                    - font-size: 10px
                    - white-space: normal
                state:
                  - operator: template
                    value: >-
                      [[[ return entity.state === 'on' &&
                      states['input_select.energy_manual_activity_type']?.state ===
                      'Shower'; ]]]
                    styles:
                      card:
                        - background: rgba(30, 160, 110, 0.16)
                      icon:
                        - color: var(--success-color)
              - type: custom:button-card
                entity: input_boolean.energy_manual_activity_running
                name: Gas cooking
                icon: mdi:pot-steam
                show_state: false
                show_label: true
                triggers_update:
                  - input_select.energy_manual_activity_type
                  - sensor.energy_manual_activity_elapsed
                label: |
                  [[[
                    return entity.state === 'on' && states['input_select.energy_manual_activity_type']?.state === 'Gas cooking'
                      ? `RUNNING · ${states['sensor.energy_manual_activity_elapsed']?.state || 0} min`
                      : 'Start gas session';
                  ]]]
                tap_action:
                  action: call-service
                  service: script.energy_start_gas_cooking
                styles:
                  card:
                    - min-height: 66px
                    - border-radius: 12px
                    - padding: 8px
                  icon:
                    - width: 24px
                  name:
                    - font-weight: 600
                    - font-size: 13px
                  label:
                    - font-size: 10px
                    - white-space: normal
                state:
                  - operator: template
                    value: >-
                      [[[ return entity.state === 'on' &&
                      states['input_select.energy_manual_activity_type']?.state ===
                      'Gas cooking'; ]]]
                    styles:
                      card:
                        - background: rgba(30, 160, 110, 0.16)
                      icon:
                        - color: var(--success-color)
              - type: custom:button-card
                entity: input_boolean.energy_manual_activity_running
                name: Electric cooking
                icon: mdi:stove
                show_state: false
                show_label: true
                triggers_update:
                  - input_select.energy_manual_activity_type
                  - sensor.energy_manual_activity_elapsed
                label: |
                  [[[
                    return entity.state === 'on' && states['input_select.energy_manual_activity_type']?.state === 'Electric cooking'
                      ? `RUNNING · ${states['sensor.energy_manual_activity_elapsed']?.state || 0} min`
                      : 'Start electricity session';
                  ]]]
                tap_action:
                  action: call-service
                  service: script.energy_start_electric_cooking
                styles:
                  card:
                    - min-height: 66px
                    - border-radius: 12px
                    - padding: 8px
                  icon:
                    - width: 24px
                  name:
                    - font-weight: 600
                    - font-size: 13px
                  label:
                    - font-size: 10px
                    - white-space: normal
                state:
                  - operator: template
                    value: >-
                      [[[ return entity.state === 'on' &&
                      states['input_select.energy_manual_activity_type']?.state ===
                      'Electric cooking'; ]]]
                    styles:
                      card:
                        - background: rgba(30, 160, 110, 0.16)
                      icon:
                        - color: var(--success-color)
          - type: entities
            title: Other activity
            show_header_toggle: false
            entities:
              - entity: input_text.energy_manual_activity_name
                name: Activity name
              - entity: input_select.energy_manual_energy_source
                name: Energy source
              - type: button
                name: Start other activity
                icon: mdi:play-circle-outline
                action_name: Start
                tap_action:
                  action: perform-action
                  perform_action: script.turn_on
                  target:
                    entity_id: script.energy_start_custom
      - type: grid
        title: Appliance activity
        column_span: 2
        cards:
          - type: custom:button-card
            entity: binary_sensor.washing_machine_running
            show_icon: false
            show_name: false
            show_state: false
            tap_action:
              action: none
            triggers_update:
              - binary_sensor.washing_machine_running
              - sensor.smart_plug_3_this_month_s_consumption
              - sensor.energy_washer_cost_this_month
              - sensor.energy_washer_runtime_this_month
              - sensor.energy_washer_starts_this_month
              - binary_sensor.dryer_running
              - sensor.fridge_2_this_month_s_consumption
              - sensor.energy_dryer_cost_this_month
              - sensor.energy_dryer_runtime_this_month
              - sensor.energy_dryer_starts_this_month
              - binary_sensor.energy_dishwasher_running
              - sensor.tv_outlet_this_month_s_consumption
              - sensor.energy_dishwasher_cost_this_month
              - sensor.energy_dishwasher_runtime_this_month
              - sensor.energy_dishwasher_starts_this_month
              - binary_sensor.energy_laptop_running
              - sensor.garden_house_this_month_s_consumption
              - sensor.energy_laptop_cost_this_month
              - sensor.energy_laptop_runtime_this_month
              - sensor.energy_laptop_starts_this_month
              - binary_sensor.energy_oven_powered
              - sensor.energy_oven_runtime_this_month
              - sensor.energy_oven_starts_this_month
              - binary_sensor.energy_tv_box_awake
              - sensor.energy_tv_box_runtime_this_month
              - sensor.energy_tv_box_starts_this_month
            custom_fields:
              appliance_list: |
                [[[
                  const appliances = [
                    { name: 'Washer', entity: 'binary_sensor.washing_machine_running', energy: 'sensor.smart_plug_3_this_month_s_consumption', cost: 'sensor.energy_washer_cost_this_month', runtime: 'sensor.energy_washer_runtime_this_month', sessions: 'sensor.energy_washer_starts_this_month' },
                    { name: 'Dryer', entity: 'binary_sensor.dryer_running', energy: 'sensor.fridge_2_this_month_s_consumption', cost: 'sensor.energy_dryer_cost_this_month', runtime: 'sensor.energy_dryer_runtime_this_month', sessions: 'sensor.energy_dryer_starts_this_month' },
                    { name: 'Dishwasher', entity: 'binary_sensor.energy_dishwasher_running', energy: 'sensor.tv_outlet_this_month_s_consumption', cost: 'sensor.energy_dishwasher_cost_this_month', runtime: 'sensor.energy_dishwasher_runtime_this_month', sessions: 'sensor.energy_dishwasher_starts_this_month' },
                    { name: 'Laptop', entity: 'binary_sensor.energy_laptop_running', energy: 'sensor.garden_house_this_month_s_consumption', cost: 'sensor.energy_laptop_cost_this_month', runtime: 'sensor.energy_laptop_runtime_this_month', sessions: 'sensor.energy_laptop_starts_this_month' },
                    { name: 'Oven', entity: 'binary_sensor.energy_oven_powered', energy: null, cost: null, runtime: 'sensor.energy_oven_runtime_this_month', sessions: 'sensor.energy_oven_starts_this_month' },
                    { name: 'TV Box', entity: 'binary_sensor.energy_tv_box_awake', energy: null, cost: null, runtime: 'sensor.energy_tv_box_runtime_this_month', sessions: 'sensor.energy_tv_box_starts_this_month' }
                  ];
                  const value = (id, decimals, fallbackUnit) => {
                    const item = hass.states[id];
                    if (!item || item.state === 'unknown' || item.state === 'unavailable') return '—';
                    const number = Number(item.state);
                    if (!Number.isFinite(number)) return item.state;
                    const unit = item.attributes.unit_of_measurement || fallbackUnit || '';
                    return number.toFixed(decimals) + (unit ? ' ' + unit : '');
                  };
                  const money = (id) => {
                    const item = hass.states[id];
                    if (!item || item.state === 'unknown' || item.state === 'unavailable') return '—';
                    const number = Number(item.state);
                    return Number.isFinite(number) ? '€' + number.toFixed(2) : item.state;
                  };
                  const rows = appliances.map((a) => {
                    const state = hass.states[a.entity];
                    const running = state && state.state === 'on';
                    const status = !state ? 'SENSOR MISSING' : running ? 'RUNNING' : state.state === 'off' ? 'IDLE' : state.state.toUpperCase();
                    const nameColor = !state ? 'var(--error-color)' : running ? 'var(--success-color)' : 'var(--primary-text-color)';
                    const energy = a.energy ? value(a.energy, 2, 'kWh') : 'Not metered';
                    const cost = a.cost ? money(a.cost) : '—';
                    const runtime = value(a.runtime, 1, 'h');
                    const sessions = value(a.sessions, 0, '');
                    return '<div style="padding:6px 0;border-bottom:1px solid var(--divider-color);">' +
                      '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:3px;">' +
                        '<span style="font-size:14px;line-height:18px;font-weight:700;color:' + nameColor + ';">' + a.name + '</span>' +
                        '<span style="font-size:9px;letter-spacing:.04em;opacity:.65;">' + status + '</span>' +
                      '</div>' +
                      '<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:8px;row-gap:2px;font-size:10px;line-height:15px;color:var(--secondary-text-color);">' +
                        '<span>Energy: <b style="color:var(--primary-text-color);font-weight:500;">' + energy + '</b></span>' +
                        '<span>Cost: <b style="color:var(--primary-text-color);font-weight:500;">' + cost + '</b></span>' +
                        '<span>Runtime: <b style="color:var(--primary-text-color);font-weight:500;">' + runtime + '</b></span>' +
                        '<span>Sessions: <b style="color:var(--primary-text-color);font-weight:500;">' + sessions + '</b></span>' +
                      '</div>' +
                    '</div>';
                  }).join('');
                  return '<div style="width:100%;">' +
                    '<div style="padding:0 0 3px;font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--secondary-text-color);">THIS MONTH</div>' +
                    rows +
                    '<div style="padding-top:7px;font-size:9px;line-height:13px;color:var(--secondary-text-color);">' +
                      'Electricity cost uses the configured €0.26697/kWh estimate. Oven and TV Box are activity-only and have no individual kWh meter; Oven tracks powered state and TV Box tracks awake state. ' +
                      'Runtime and session totals depend on Recorder retention. Sessions count ON periods, not raw state changes.' +
                    '</div></div>';
                ]]]
              activity_24h:
                card:
                  type: custom:button-card
                  name: 24 hours activity
                  show_icon: false
                  show_state: false
                  tap_action:
                    action: fire-dom-event
                    browser_mod:
                      service: browser_mod.popup
                      data:
                        title: Appliance activity · last 24 hours
                        size: normal
                        content:
                          type: history-graph
                          title: Last 24 hours
                          hours_to_show: 24
                          show_names: true
                          label_position: below
                          entities:
                            - entity: binary_sensor.washing_machine_running
                              name: Washer
                            - entity: binary_sensor.dryer_running
                              name: Dryer
                            - entity: binary_sensor.energy_dishwasher_running
                              name: Dishwasher
                            - entity: binary_sensor.energy_laptop_running
                              name: Laptop
                            - entity: binary_sensor.energy_oven_powered
                              name: Oven
                            - entity: binary_sensor.energy_tv_box_awake
                              name: TV Box
                  styles:
                    card:
                      - background: transparent
                      - box-shadow: none
                      - border: 0
                      - padding: 3px 2px
                      - min-height: 30px
                    name:
                      - color: var(--primary-color)
                      - font-size: 11px
                      - font-weight: 600
                      - text-decoration: underline
              activity_week:
                card:
                  type: custom:button-card
                  name: 1 week activity
                  show_icon: false
                  show_state: false
                  tap_action:
                    action: fire-dom-event
                    browser_mod:
                      service: browser_mod.popup
                      data:
                        title: Appliance activity · last 7 days
                        size: normal
                        content:
                          type: history-graph
                          title: Last 7 days
                          hours_to_show: 168
                          show_names: true
                          label_position: below
                          entities:
                            - entity: binary_sensor.washing_machine_running
                              name: Washer
                            - entity: binary_sensor.dryer_running
                              name: Dryer
                            - entity: binary_sensor.energy_dishwasher_running
                              name: Dishwasher
                            - entity: binary_sensor.energy_laptop_running
                              name: Laptop
                            - entity: binary_sensor.energy_oven_powered
                              name: Oven
                            - entity: binary_sensor.energy_tv_box_awake
                              name: TV Box
                  styles:
                    card:
                      - background: transparent
                      - box-shadow: none
                      - border: 0
                      - padding: 3px 2px
                      - min-height: 30px
                    name:
                      - color: var(--primary-color)
                      - font-size: 11px
                      - font-weight: 600
                      - text-decoration: underline
            styles:
              card:
                - border-radius: 14px
                - padding: 10px 12px
              grid:
                - grid-template-areas: '"appliance_list appliance_list" "activity_24h activity_week"'
                - grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)
                - grid-template-rows: min-content min-content
                - column-gap: 8px
                - row-gap: 5px
              custom_fields:
                appliance_list:
                  - width: 100%
                  - justify-self: stretch
                  - align-self: stretch
                activity_24h:
                  - width: 100%
                  - justify-self: stretch
                activity_week:
                  - width: 100%
                  - justify-self: stretch
      - type: grid
        title: Recent consumption
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:button-card
                entity: sensor.slimmelezer_electricity_total
                name: History & costs
                icon: mdi:chart-box-outline
                show_state: false
                show_label: true
                label: Hourly · daily · monthly
                tap_action:
                  action: more-info
                double_tap_action:
                  action: fire-dom-event
                  browser_mod:
                    service: browser_mod.popup
                    data:
                      title: Energy history & costs
                      size: normal
                      content:
                        type: vertical-stack
                        cards:
                          - type: entities
                            title: Meter totals
                            entities:
                              - entity: sensor.slimmelezer_mini_energy_consumed_tariff_1
                                name: Tariff 1 · cumulative kWh
                              - entity: sensor.slimmelezer_mini_energy_consumed_tariff_2
                                name: Tariff 2 · cumulative kWh
                              - entity: sensor.slimmelezer_electricity_total
                                name: Total electricity · kWh
                              - entity: sensor.slimmelezer_mini_gas_consumed
                                name: Gas meter · cumulative m³
                          - type: statistics-graph
                            title: Electricity by hour · 7 days
                            chart_type: bar-stack
                            period: hour
                            days_to_show: 7
                            stat_types:
                              - change
                            entities:
                              - entity: sensor.slimmelezer_mini_energy_consumed_tariff_1
                                name: T1
                              - entity: sensor.slimmelezer_mini_energy_consumed_tariff_2
                                name: T2
                          - type: statistics-graph
                            title: Gas by hour · 7 days
                            chart_type: bar
                            period: hour
                            days_to_show: 7
                            stat_types:
                              - change
                            entities:
                              - entity: sensor.slimmelezer_mini_gas_consumed
                                name: Gas
                          - type: statistics-graph
                            title: Electricity by day · 30 days
                            chart_type: bar
                            period: day
                            days_to_show: 30
                            stat_types:
                              - change
                            entities:
                              - entity: sensor.slimmelezer_electricity_total
                                name: Electricity · kWh
                          - type: statistics-graph
                            title: Gas by day · 30 days
                            chart_type: bar
                            period: day
                            days_to_show: 30
                            stat_types:
                              - change
                            entities:
                              - entity: sensor.slimmelezer_mini_gas_consumed
                                name: Gas · m³
                          - type: statistics-graph
                            title: Daily cost · 30 days
                            chart_type: bar-stack
                            period: day
                            days_to_show: 30
                            stat_types:
                              - change
                            entities:
                              - entity: sensor.slimmelezer_electricity_cost_total
                                name: Electricity · €
                              - entity: sensor.slimmelezer_gas_cost_total
                                name: Gas · €
                          - type: statistics-graph
                            title: Monthly cost · 12 months
                            chart_type: bar-stack
                            period: month
                            days_to_show: 365
                            stat_types:
                              - change
                            entities:
                              - entity: sensor.slimmelezer_electricity_cost_total
                                name: Electricity · €
                              - entity: sensor.slimmelezer_gas_cost_total
                                name: Gas · €
                styles:
                  card:
                    - min-height: 68px
                    - border-radius: 14px
                    - padding: 12px
                  grid:
                    - grid-template-areas: '"i n" "i l"'
                    - grid-template-columns: 38px 1fr
                  icon:
                    - width: 26px
                  name:
                    - justify-self: start
                    - font-size: 13px
                    - font-weight: 600
                  label:
                    - justify-self: start
                    - font-size: 11px
                    - opacity: 0.6
              - type: custom:button-card
                entity: binary_sensor.energy_thermostat_heating
                name: Heating & gas
                icon: mdi:radiator
                show_state: false
                show_label: true
                label: Heating split · shower markers
                tap_action:
                  action: more-info
                double_tap_action:
                  action: fire-dom-event
                  browser_mod:
                    service: browser_mod.popup
                    data:
                      title: Heating & gas analysis
                      size: normal
                      content:
                        type: vertical-stack
                        cards:
                          - type: thermostat
                            entity: climate.tstat_838e9c_lyric_t6_thermostat
                            name: Resideo T6
                          - type: entities
                            title: Heating and gas allocation
                            entities:
