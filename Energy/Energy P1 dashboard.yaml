                              sensors must be OFF, and none of the selected room
                              motion sensors may be ON.

                              OFF = a person is reported home, motion is detected,
                              or the ten-minute empty confirmation has not finished.
                              Unavailable = one of the two person-presence sources
                              cannot provide a valid ON/OFF state.

