                  activity_week:
                    card:
                      type: custom:button-card
                      name: 1 week activity
                      show_icon: false
                      show_state: false
                      tap_action:
                        action: fire-dom-event
                        browser_mod:
                          service: browser_mod.popup
                          data:
                            title: Appliance activity · last 7 days
                            size: normal
                            content:
                              type: history-graph
                              title: Last 7 days
                              hours_to_show: 168
                              show_names: true
                              label_position: below
                              entities:
                                - entity: binary_sensor.energy_washer_cycle_running
                                  name: Washer
                                - entity: binary_sensor.energy_dryer_cycle_running
                                  name: Dryer
                                - entity: binary_sensor.energy_dishwasher_running
                                  name: Dishwasher
                                - entity: binary_sensor.energy_laptop_running
                                  name: Laptop
                                - entity: binary_sensor.energy_oven_powered
                                  name: Oven
                                - entity: binary_sensor.energy_tv_box_awake
                                  name: TV Box
                      styles:
                        card:
                          - background: transparent
                          - box-shadow: none
                          - border: 0
                          - padding: 3px 2px
                          - min-height: 30px
                        name:
                          - color: var(--primary-color)
                          - font-size: 11px
                          - font-weight: 600
                          - text-decoration: underline
                styles:
                  card:
                    - border-radius: 14px
                    - padding: 10px 12px
                  grid:
                    - grid-template-areas: '"appliance_list appliance_list" "activity_24h activity_week"'
                    - grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)
                    - grid-template-rows: min-content min-content
