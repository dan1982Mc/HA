                            content: >
                              Gas attribution is time-weighted. Home Assistant tracks
                              the T6 hvac_action state changes and checks the state
                              every minute. When the gas meter updates, the interval's
                              measured gas increase is divided according to the time
                              spent heating, idle/off, or unknown. This assumes gas
                              flow is approximately uniform during that interval;
                              simultaneous showering or cooking can still skew the
                              estimate. Time while Home Assistant is offline is
                              allocated to unknown. The older snapshot-based sensors
                              remain available for comparison but are not used here.

