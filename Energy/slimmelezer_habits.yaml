        state: "{{ states('input_number.energy_manual_custom_electricity_net_total') | float(0) | round(3) }}"

  # Statistics sample sources are force-refreshed by the 5-minute sampling timestamp.
  # Attribute changes are also recorded by the Statistics integration, allowing repeated
  # identical sample values (including zero-use intervals) to be represented.
  - triggers:
      - trigger: state
