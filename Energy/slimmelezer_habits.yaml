# ------------------------------------------------------------
# STATE-BASED TEMPLATE SENSORS
# ------------------------------------------------------------
template:
  - sensor:
      # Combined T1 + T2 cumulative electricity register.
      - name: Slimmelezer Electricity Total
        unique_id: slimmelezer_electricity_total
        device_class: energy
        state_class: total_increasing
        unit_of_measurement: kWh
        availability: >
          {{ is_number(states('sensor.slimmelezer_mini_energy_consumed_tariff_1'))
             and is_number(states('sensor.slimmelezer_mini_energy_consumed_tariff_2')) }}
        state: >
          {{ (states('sensor.slimmelezer_mini_energy_consumed_tariff_1') | float(0)
              + states('sensor.slimmelezer_mini_energy_consumed_tariff_2') | float(0)) | round(3) }}

      # Lifetime variable electricity cost at the supplied fixed rate.
      - name: Slimmelezer Electricity Cost Total
        unique_id: slimmelezer_electricity_cost_total
        device_class: monetary
        state_class: total_increasing
        unit_of_measurement: EUR
        availability: "{{ is_number(states('sensor.slimmelezer_electricity_total')) }}"
        state: >
          {{ (states('sensor.slimmelezer_electricity_total') | float(0) * 0.26697) | round(5) }}

      # Lifetime variable gas cost at the supplied fixed rate.
      - name: Slimmelezer Gas Cost Total
        unique_id: slimmelezer_gas_cost_total
        device_class: monetary
        state_class: total_increasing
        unit_of_measurement: EUR
        availability: "{{ is_number(states('sensor.slimmelezer_mini_gas_consumed')) }}"
        state: >
          {{ (states('sensor.slimmelezer_mini_gas_consumed') | float(0) * 1.43817) | round(5) }}

      # Total estimated variable cost for electricity + gas.
      - name: Slimmelezer Energy Cost Total
        unique_id: slimmelezer_energy_cost_total
        device_class: monetary
        state_class: total_increasing
        unit_of_measurement: EUR
        availability: >
          {{ is_number(states('sensor.slimmelezer_electricity_cost_total'))
             and is_number(states('sensor.slimmelezer_gas_cost_total')) }}
        state: >
          {{ (states('sensor.slimmelezer_electricity_cost_total') | float(0)
              + states('sensor.slimmelezer_gas_cost_total') | float(0)) | round(5) }}

      # Appliance monthly cost proxies. The source entities are the
      # existing monthly kWh sensors from the washer/dryer smart plugs.
      - name: Energy Washer Cost This Month
        unique_id: energy_washer_cost_this_month
        device_class: monetary
        state_class: measurement
        unit_of_measurement: EUR
        availability: "{{ is_number(states('sensor.smart_plug_3_this_month_s_consumption')) }}"
        state: >
          {{ (states('sensor.smart_plug_3_this_month_s_consumption') | float(0) * 0.26697) | round(2) }}

      - name: Energy Dryer Cost This Month
        unique_id: energy_dryer_cost_this_month
        device_class: monetary
        state_class: measurement
        unit_of_measurement: EUR
        availability: "{{ is_number(states('sensor.fridge_2_this_month_s_consumption')) }}"
        state: >
          {{ (states('sensor.fridge_2_this_month_s_consumption') | float(0) * 0.26697) | round(2) }}

      - name: Energy Dishwasher Cost This Month
        unique_id: energy_dishwasher_cost_this_month
        device_class: monetary
        state_class: measurement
        unit_of_measurement: EUR
        availability: "{{ is_number(states('sensor.tv_outlet_this_month_s_consumption')) }}"
        state: >
          {{ (states('sensor.tv_outlet_this_month_s_consumption') | float(0) * 0.26697) | round(2) }}

      - name: Energy Laptop Cost This Month
        unique_id: energy_laptop_cost_this_month
        device_class: monetary
        state_class: measurement
        unit_of_measurement: EUR
        availability: "{{ is_number(states('sensor.garden_house_this_month_s_consumption')) }}"
        state: >
          {{ (states('sensor.garden_house_this_month_s_consumption') | float(0) * 0.26697) | round(2) }}

  - sensor:
      - name: Energy House Empty Check
        unique_id: energy_house_empty_check
        icon: mdi:clipboard-check-outline
        state: >
          {% set reasons = [] %}
          {% if is_state('binary_sensor.anca_presence_combined', 'on') %}
            {% set reasons = reasons + ['Anca presence is home'] %}
          {% endif %}
          {% if is_state('binary_sensor.dan_presence_combined', 'on') %}
            {% set reasons = reasons + ['Dan presence is home'] %}
          {% endif %}
          {% set motion_ids = [
            'binary_sensor.kitchen_motion_sensor',
            'binary_sensor.small_bedroom_motion_occupancy',
            'binary_sensor.bathroom_motion_occupancy',
            'binary_sensor.big_bedroom_motion_occupancy',
            'binary_sensor.hal_motion_all',
            'binary_sensor.living_room_motion_all'
          ] %}
          {% for item in expand(motion_ids) %}
            {% if item.state == 'on' %}
              {% set reasons = reasons + [item.name ~ ' detects motion'] %}
            {% elif item.state in ['unknown', 'unavailable'] %}
              {% set reasons = reasons + [item.name ~ ' unavailable'] %}
            {% endif %}
          {% endfor %}
          {% if states('binary_sensor.anca_presence_combined') in ['unknown', 'unavailable'] %}
            {% set reasons = reasons + ['Anca presence unavailable'] %}
          {% endif %}
          {% if states('binary_sensor.dan_presence_combined') in ['unknown', 'unavailable'] %}
            {% set reasons = reasons + ['Dan presence unavailable'] %}
          {% endif %}
          {{ reasons | join('; ') if reasons | count > 0 else 'No people or motion detected; empty confirmation pending' }}
        attributes:
          people_away: >
            {{ is_state('binary_sensor.anca_presence_combined', 'off')
               and is_state('binary_sensor.dan_presence_combined', 'off') }}
          entry_contact_open: "{{ is_state('binary_sensor.energy_entry_contact_open', 'on') }}"

  - binary_sensor:
      # Existing combined presence sensors are the primary source of truth.
      # In the existing automations, ON means the person has arrived/home;
      # OFF means away. The empty-house sensor therefore requires BOTH OFF.
      - name: Energy Shower Start Conditions Met
        unique_id: energy_shower_start_conditions_met
        icon: mdi:shower
        availability: >
          {{ is_number(states('sensor.thermometer_living_humidity'))
             and states('light.bathroom_lights_all') in ['on', 'off']
             and states('binary_sensor.bathroom_door_contact') in ['on', 'off'] }}
        state: >
          {{ states('sensor.thermometer_living_humidity') | float(0) > 85
             and is_state('light.bathroom_lights_all', 'on')
             and is_state('binary_sensor.bathroom_door_contact', 'off') }}

      - name: Energy Someone Home
        unique_id: energy_someone_home
        icon: mdi:home-account
        availability: >
          {{ states('binary_sensor.anca_presence_combined') in ['on', 'off']
             and states('binary_sensor.dan_presence_combined') in ['on', 'off'] }}
        state: >
          {{ is_state('binary_sensor.anca_presence_combined', 'on')
             or is_state('binary_sensor.dan_presence_combined', 'on') }}

      # Motion is an optional safety override, NOT a dependency for availability.
      # Any monitored motion reporting ON means occupied. Unknown/unavailable
      # motion entities are skipped and reported by Energy House Empty Check.
      # This prevents one offline motion sensor from making the whole house
      # occupancy result unavailable. Combined person-presence sensors remain
      # the authoritative source for whether someone is home.
      - name: Energy Motion Detected
        unique_id: energy_motion_detected
        icon: mdi:motion-sensor
        state: >
          {% set motion_ids = [
            'binary_sensor.kitchen_motion_sensor',
            'binary_sensor.small_bedroom_motion_occupancy',
            'binary_sensor.bathroom_motion_occupancy',
            'binary_sensor.big_bedroom_motion_occupancy',
            'binary_sensor.hal_motion_all',
            'binary_sensor.living_room_motion_all'
          ] %}
          {{ expand(motion_ids) | selectattr('state', 'eq', 'on') | list | count > 0 }}

      # Contact sensors are retained as diagnostics, but do NOT block the
      # empty-house state. A door/window left open should not make an empty
      # apartment appear occupied indefinitely.
      - name: Energy Entry Contact Open
        unique_id: energy_entry_contact_open
        icon: mdi:door-open
        availability: >
          {{ states('binary_sensor.contactsensor_rear_door_2') in ['on', 'off']
             and states('binary_sensor.contactsensor_front_door_2') in ['on', 'off'] }}
        state: >
          {{ is_state('binary_sensor.contactsensor_rear_door_2', 'on')
             or is_state('binary_sensor.contactsensor_front_door_2', 'on') }}

      # Empty = both combined person-presence sensors report away AND no
      # monitored motion sensor currently reports ON. Availability depends
      # ONLY on the two authoritative combined presence sensors. An offline
      # motion sensor must not make this entity unavailable; it is listed in
      # Energy House Empty Check instead. Entry contacts are diagnostics only.
      - name: Energy House Empty
        unique_id: energy_house_empty
        icon: mdi:home-export-outline
        availability: >
          {{ states('binary_sensor.anca_presence_combined') in ['on', 'off']
             and states('binary_sensor.dan_presence_combined') in ['on', 'off'] }}
        state: >
          {{ is_state('binary_sensor.anca_presence_combined', 'off')
             and is_state('binary_sensor.dan_presence_combined', 'off')
             and is_state('binary_sensor.energy_motion_detected', 'off') }}
        delay_on: "00:10:00"

      - name: Energy Thermostat Heating
        unique_id: energy_thermostat_heating
        icon: mdi:radiator
        availability: >
          {{ states('climate.tstat_838e9c_lyric_t6_thermostat') not in ['unknown', 'unavailable']
             and state_attr('climate.tstat_838e9c_lyric_t6_thermostat', 'hvac_action') in ['heating', 'idle', 'off'] }}
        state: >
          {{ state_attr('climate.tstat_838e9c_lyric_t6_thermostat', 'hvac_action') == 'heating' }}

      # Use the same current thresholds as the laundry completion automations.
      # The off delays keep a machine marked active through short load/thermostat
      # pauses, so one appliance program is counted as one session.
      - name: Energy Washer Cycle Running
        unique_id: energy_washer_cycle_running
        device_class: running
        icon: mdi:washing-machine
        availability: "{{ is_number(states('sensor.smart_plug_3_current')) }}"
        state: "{{ states('sensor.smart_plug_3_current') | float(0) > 0.1 }}"
        delay_off: "00:15:00"

      - name: Energy Dryer Cycle Running
        unique_id: energy_dryer_cycle_running
        device_class: running
        icon: mdi:tumble-dryer
        availability: "{{ is_number(states('sensor.fridge_2_current')) }}"
        state: "{{ states('sensor.fridge_2_current') | float(0) > 0.25 }}"
        delay_off: "00:05:00"

      - name: Energy Dishwasher Running
        unique_id: energy_dishwasher_running
        icon: mdi:dishwasher
        # The progress sensor can be non-numeric while the dishwasher is idle.
        # Keep this binary sensor available and interpret that state as OFF.
        state: >
          {% set progress = states('sensor.dishwasher_program_progress') %}
          {% if is_number(progress) %}
            {% set progress_value = progress | float(0) %}
            {{ progress_value > 0 and progress_value < 100 }}
          {% else %}
            false
          {% endif %}

      # This is the oven's power switch state, not proof of active heating.
      - name: Energy Oven Powered
        unique_id: energy_oven_powered
        icon: mdi:stove
        availability: "{{ states('switch.oven_power') in ['on', 'off'] }}"
        state: "{{ is_state('switch.oven_power', 'on') }}"

      # Media-player state indicates the TV box is awake/active, not its wattage.
      - name: Energy TV Box Awake
        unique_id: energy_tv_box_awake
        icon: mdi:television
        availability: "{{ states('media_player.mibox4') not in ['unknown', 'unavailable'] }}"
        state: "{{ states('media_player.mibox4') not in ['off', 'standby', 'unknown', 'unavailable'] }}"

      # Laptop activity uses the same 0.05 current threshold as the PC dashboard.
      - name: Energy Laptop Running
        unique_id: energy_laptop_running
        icon: mdi:laptop
        availability: "{{ is_number(states('sensor.garden_house_current')) }}"
        state: "{{ states('sensor.garden_house_current') | float(0) > 0.05 }}"

# ------------------------------------------------------------
# TRIGGER-BASED GAS ATTRIBUTION
# ------------------------------------------------------------
# Each new gas-meter reading is differenced against the previous
# reading and assigned according to the thermostat's hvac_action
# at that update: heating / idle-or-off / unknown.
# Counters start from zero when first installed and do not backfill.
# ------------------------------------------------------------
  - triggers:
      - trigger: state
        entity_id: sensor.slimmelezer_mini_gas_consumed
    sensor:
      - name: Slimmelezer Gas During Heating Demand
        unique_id: slimmelezer_gas_during_heating_demand
        device_class: gas
        state_class: total_increasing
        unit_of_measurement: m³
        icon: mdi:radiator
        state: >
          {% set old = trigger.from_state.state if trigger.from_state is not none else 'unknown' %}
          {% set new = trigger.to_state.state if trigger.to_state is not none else 'unknown' %}
          {% set delta = (new | float(0)) - (old | float(0)) if is_number(old) and is_number(new) else 0 %}
          {% set delta = [delta, 0] | max %}
          {% set previous_total = this.state | float(0) %}
          {% if state_attr('climate.tstat_838e9c_lyric_t6_thermostat', 'hvac_action') == 'heating' %}
            {{ (previous_total + delta) | round(3) }}
          {% else %}
            {{ previous_total | round(3) }}
          {% endif %}

      - name: Slimmelezer Gas Outside Heating Demand
        unique_id: slimmelezer_gas_outside_heating_demand
        device_class: gas
        state_class: total_increasing
        unit_of_measurement: m³
        icon: mdi:water-boiler
        state: >
          {% set old = trigger.from_state.state if trigger.from_state is not none else 'unknown' %}
          {% set new = trigger.to_state.state if trigger.to_state is not none else 'unknown' %}
          {% set delta = (new | float(0)) - (old | float(0)) if is_number(old) and is_number(new) else 0 %}
          {% set delta = [delta, 0] | max %}
          {% set previous_total = this.state | float(0) %}
          {% set action = state_attr('climate.tstat_838e9c_lyric_t6_thermostat', 'hvac_action') %}
          {% if action in ['idle', 'off'] %}
            {{ (previous_total + delta) | round(3) }}
          {% else %}
            {{ previous_total | round(3) }}
          {% endif %}

      - name: Slimmelezer Gas Unclassified
        unique_id: slimmelezer_gas_unclassified
        device_class: gas
        state_class: total_increasing
        unit_of_measurement: m³
        icon: mdi:help-circle-outline
        state: >
          {% set old = trigger.from_state.state if trigger.from_state is not none else 'unknown' %}
          {% set new = trigger.to_state.state if trigger.to_state is not none else 'unknown' %}
          {% set delta = (new | float(0)) - (old | float(0)) if is_number(old) and is_number(new) else 0 %}
          {% set delta = [delta, 0] | max %}
          {% set previous_total = this.state | float(0) %}
          {% set action = state_attr('climate.tstat_838e9c_lyric_t6_thermostat', 'hvac_action') %}
          {% if action not in ['heating', 'idle', 'off'] %}
            {{ (previous_total + delta) | round(3) }}
          {% else %}
            {{ previous_total | round(3) }}
          {% endif %}

  - sensor:
      # Time-weighted attribution counters. The legacy trigger-based sensors
      # above are retained as a snapshot-based comparison, not used by the
      # new monthly gas split.
      - name: Slimmelezer Gas Heating Time Weighted
        unique_id: slimmelezer_gas_heating_time_weighted
