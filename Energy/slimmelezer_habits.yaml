# ------------------------------------------------------------
# MONTHLY GAS SPLIT
# Heating is tracked from the thermostat-based gas attribution counter.
# Other gas is calculated in the dashboard as total monthly gas minus
# this heating meter, so it includes idle/off and unclassified use.
# The first monthly cycle is partial after installation; the first full
# cycle begins at the next monthly reset.
# ------------------------------------------------------------
utility_meter:
  energy_electricity_total_month:
    name: Energy Electricity Total Month
    unique_id: energy_electricity_total_month
    source: sensor.slimmelezer_electricity_total
    cycle: monthly
    periodically_resetting: true
    always_available: true
  energy_cost_total_month:
    name: Energy Cost Total Month
    unique_id: energy_cost_total_month
    source: sensor.slimmelezer_energy_cost_total
    cycle: monthly
    periodically_resetting: true
    always_available: true
  energy_electricity_total_energy_year:
    name: Energy Electricity Total Energy Year
    unique_id: energy_electricity_total_energy_year
    source: sensor.slimmelezer_electricity_total
    cron: "0 0 1 7 *"
    periodically_resetting: true
