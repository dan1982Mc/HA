automation:
  - id: energy_baseline_sample_every_five_minutes
    alias: Energy - Learn quiet baseline every 5 minutes
    description: >-
      Learns the normal low-load electricity baseline and gas baselines split by
      thermostat heating demand. Samples are not taken during manual activity sessions.
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/5"
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.energy_baseline_initialized
                state: "off"
            sequence:
              - condition: template
                value_template: >-
                  {{ is_number(states('sensor.slimmelezer_mini_gas_consumed'))
                     and is_number(states('sensor.slimmelezer_electricity_total')) }}
              - service: input_number.set_value
                target:
                  entity_id: input_number.energy_baseline_last_gas_m3
                data:
                  value: "{{ states('sensor.slimmelezer_mini_gas_consumed') | float(0) }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.energy_baseline_last_electricity_kwh
                data:
                  value: "{{ states('sensor.slimmelezer_electricity_total') | float(0) }}"
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.energy_baseline_initialized
        default:
          - variables:
              gas_now: "{{ states('sensor.slimmelezer_mini_gas_consumed') | float(0) }}"
              electricity_now: "{{ states('sensor.slimmelezer_electricity_total') | float(0) }}"
              gas_previous: "{{ states('input_number.energy_baseline_last_gas_m3') | float(0) }}"
              electricity_previous: "{{ states('input_number.energy_baseline_last_electricity_kwh') | float(0) }}"
              gas_valid: "{{ is_number(states('sensor.slimmelezer_mini_gas_consumed')) }}"
              electricity_valid: "{{ is_number(states('sensor.slimmelezer_electricity_total')) }}"
              hvac_action: "{{ state_attr('climate.tstat_838e9c_lyric_t6_thermostat', 'hvac_action') }}"
              quiet_power: >-
                {% set appliance_ids = [
                  'binary_sensor.washing_machine_running',
                  'binary_sensor.dryer_running',
                  'switch.dishwasher_power',
                  'switch.oven_power'
                ] %}
                {{ is_number(states('sensor.slimmelezer_mini_power_consumed'))
                   and states('sensor.slimmelezer_mini_power_consumed') | float(999999)
                       <= states('input_number.energy_baseline_max_power_w') | float(450)
                   and state_attr('sensor.slimmelezer_mini_power_consumed', 'unit_of_measurement') == 'W'
                   and (expand(appliance_ids) | selectattr('state', 'eq', 'off') | list | count) == (appliance_ids | count) }}
          - variables:
              gas_delta: "{{ ([gas_now | float(0) - gas_previous | float(0), 0] | max) | round(6) }}"
              electricity_delta: "{{ ([electricity_now | float(0) - electricity_previous | float(0), 0] | max) | round(6) }}"
          # Always advance snapshots so a manual session or an excluded high-load
          # period never spills into the next eligible baseline interval.
          - if:
              - condition: template
                value_template: "{{ gas_valid | bool }}"
            then:
              - service: input_number.set_value
                target:
                  entity_id: input_number.energy_baseline_last_gas_m3
                data:
                  value: "{{ gas_now }}"
          - if:
              - condition: template
                value_template: "{{ electricity_valid | bool }}"
            then:
              - service: input_number.set_value
                target:
                  entity_id: input_number.energy_baseline_last_electricity_kwh
                data:
                  value: "{{ electricity_now }}"
          # Electricity quiet-baseline sample.
          - choose:
              - conditions:
                  - condition: state
                    entity_id: input_boolean.energy_manual_activity_running
                    state: "off"
                  - condition: template
                    value_template: "{{ (electricity_valid | bool) and (quiet_power | bool) }}"
                sequence:
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.energy_baseline_electricity_5m_sample
                    data:
                      value: "{{ electricity_delta }}"
                  - service: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.energy_baseline_electricity_sample_valid
            default:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.energy_baseline_electricity_sample_valid
          # Gas baseline samples are separated by thermostat demand state.
          - choose:
              - conditions:
                  - condition: state
                    entity_id: input_boolean.energy_manual_activity_running
                    state: "off"
                  - condition: template
                    value_template: "{{ (gas_valid | bool) and hvac_action == 'heating' }}"
                sequence:
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.energy_baseline_gas_heating_5m_sample
                    data:
                      value: "{{ gas_delta }}"
                  - service: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.energy_baseline_gas_heating_sample_valid
                  - service: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.energy_baseline_gas_idle_sample_valid
              - conditions:
                  - condition: state
                    entity_id: input_boolean.energy_manual_activity_running
                    state: "off"
                  - condition: template
                    value_template: "{{ (gas_valid | bool) and hvac_action in ['idle', 'off'] }}"
                sequence:
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.energy_baseline_gas_idle_5m_sample
                    data:
                      value: "{{ gas_delta }}"
                  - service: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.energy_baseline_gas_idle_sample_valid
                  - service: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.energy_baseline_gas_heating_sample_valid
            default:
              - service: input_boolean.turn_off
                target:
                  entity_id:
                    - input_boolean.energy_baseline_gas_heating_sample_valid
                    - input_boolean.energy_baseline_gas_idle_sample_valid
          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.energy_baseline_sampled_at
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  - id: energy_manual_hvac_minute_sampler
    alias: Energy - Track thermostat state during manual activity
    description: Samples T6 heating/idle time while a manual gas activity session is active.
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/1"
    conditions:
      - condition: state
        entity_id: input_boolean.energy_manual_activity_running
        state: "on"
    actions:
      - action: script.energy_manual_record_hvac_segment

