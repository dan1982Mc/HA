  # Seven-day rolling mean of quiet 5-minute meter deltas. At least 24 valid
  # samples are required before a session can show a net estimate.
  - platform: statistics
    name: Energy Baseline Electricity 5m Mean
    unique_id: energy_baseline_electricity_5m_mean
    entity_id: sensor.energy_electricity_baseline_sample
    state_characteristic: mean
    max_age:
      days: 7
    sampling_size: 2016
    precision: 6

  - platform: statistics
    name: Energy Baseline Gas Heating 5m Mean
    unique_id: energy_baseline_gas_heating_5m_mean
    entity_id: sensor.energy_gas_heating_baseline_sample
    state_characteristic: mean
    max_age:
      days: 7
    sampling_size: 2016
    precision: 6

  - platform: statistics
    name: Energy Baseline Gas Idle 5m Mean
    unique_id: energy_baseline_gas_idle_5m_mean
    entity_id: sensor.energy_gas_idle_baseline_sample
    state_characteristic: mean
    max_age:
      days: 7
    sampling_size: 2016
    precision: 6

# ------------------------------------------------------------
# MONTHLY GAS SPLIT
# Heating is tracked from the thermostat-based gas attribution counter.
# Other gas is calculated in the dashboard as total monthly gas minus
# this heating meter, so it includes idle/off and unclassified use.
# The first monthly cycle is partial after installation; the first full
# cycle begins at the next monthly reset.
# ------------------------------------------------------------
utility_meter:
  energy_gas_total_month:
    name: Energy Gas Total Month
    unique_id: energy_gas_total_month
    source: sensor.slimmelezer_mini_gas_consumed
    cycle: monthly
    periodically_resetting: true
    always_available: true
  energy_gas_heating_month:
    name: Energy Gas Heating Month
    unique_id: energy_gas_heating_month
    source: sensor.slimmelezer_gas_during_heating_demand
    cycle: monthly
    periodically_resetting: true
    always_available: true
