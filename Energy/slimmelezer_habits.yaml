      - name: Slimmelezer Gas Shower Time Weighted Cost Total
        unique_id: slimmelezer_gas_shower_time_weighted_cost_total
        device_class: monetary
        state_class: total_increasing
        unit_of_measurement: EUR
        state: "{{ (states('sensor.slimmelezer_gas_shower_time_weighted') | float(0) * 1.43817) | round(5) }}"

  - sensor:
      - name: Slimmelezer Gas Heating Cost Total
        unique_id: slimmelezer_gas_heating_cost_total
        device_class: monetary
        state_class: total_increasing
        unit_of_measurement: EUR
        availability: "{{ is_number(states('sensor.slimmelezer_gas_during_heating_demand')) }}"
        state: >
          {{ (states('sensor.slimmelezer_gas_during_heating_demand') | float(0) * 1.43817) | round(5) }}

      - name: Slimmelezer Gas Outside Heating Cost Total
        unique_id: slimmelezer_gas_outside_heating_cost_total
        device_class: monetary
        state_class: total_increasing
        unit_of_measurement: EUR
        availability: "{{ is_number(states('sensor.slimmelezer_gas_outside_heating_demand')) }}"
        state: >
          {{ (states('sensor.slimmelezer_gas_outside_heating_demand') | float(0) * 1.43817) | round(5) }}

      - name: Slimmelezer Gas Unclassified Cost Total
        unique_id: slimmelezer_gas_unclassified_cost_total
        device_class: monetary
        state_class: total_increasing
        unit_of_measurement: EUR
        availability: "{{ is_number(states('sensor.slimmelezer_gas_unclassified')) }}"
        state: >
          {{ (states('sensor.slimmelezer_gas_unclassified') | float(0) * 1.43817) | round(5) }}


  - sensor:
      - name: Energy Gas Shower Cost This Month
        unique_id: energy_gas_shower_cost_this_month
        device_class: monetary
        state_class: measurement
        unit_of_measurement: EUR
        state: "{{ (states('sensor.energy_gas_shower_month') | float(0) * 1.43817) | round(4) }}"
      - name: Energy Gas Shower Cost This Week
        unique_id: energy_gas_shower_cost_this_week
        device_class: monetary
        state_class: measurement
        unit_of_measurement: EUR
        state: "{{ (states('sensor.energy_gas_shower_week') | float(0) * 1.43817) | round(4) }}"

  - sensor:
      - name: Energy Activity Baseline Status
        unique_id: energy_activity_baseline_status
        icon: mdi:chart-bell-curve
        state: >
          {% set ec = state_attr('sensor.energy_baseline_electricity_5m_mean', 'count') | int(0) %}
          {% set gh = state_attr('sensor.energy_baseline_gas_heating_5m_mean', 'count') | int(0) %}
          {% set gi = state_attr('sensor.energy_baseline_gas_idle_5m_mean', 'count') | int(0) %}
          {% if ec >= 24 and gh >= 24 and gi >= 24 %}
            Baseline established · electricity {{ ec }} · gas heating {{ gh }} · gas idle {{ gi }} samples
          {% else %}
            Learning baseline · electricity {{ ec }}/24 · gas heating {{ gh }}/24 · gas idle {{ gi }}/24 samples
          {% endif %}
        attributes:
          electricity_samples: "{{ state_attr('sensor.energy_baseline_electricity_5m_mean', 'count') | int(0) }}"
          gas_heating_samples: "{{ state_attr('sensor.energy_baseline_gas_heating_5m_mean', 'count') | int(0) }}"
          gas_idle_samples: "{{ state_attr('sensor.energy_baseline_gas_idle_5m_mean', 'count') | int(0) }}"

      # Baseline and net cumulative counters for activities. Existing *_total sensors are gross.
      - name: Energy Manual Shower Gas Baseline Total
        unique_id: energy_manual_shower_gas_baseline_total_sensor
        device_class: gas
        state_class: total_increasing
        unit_of_measurement: m³
        state: "{{ states('input_number.energy_manual_shower_gas_baseline_total') | float(0) | round(3) }}"
      - name: Energy Manual Shower Gas Net Total
        unique_id: energy_manual_shower_gas_net_total_sensor
