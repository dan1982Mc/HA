  - id: energy_period_meters_seed_from_statistics
    alias: Energy - Initialize month and energy-year meters
    description: >-
      Seeds the current month and July-to-June utility meters from retained
      long-term statistics, including the usage before this package change.
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/10"
    conditions:
      - condition: state
        entity_id: input_boolean.energy_period_meters_seeded
        state: "off"
      - condition: template
        value_template: >-
          {{ is_number(states('sensor.slimmelezer_electricity_total'))
             and is_number(states('sensor.slimmelezer_mini_gas_consumed'))
             and is_number(states('sensor.slimmelezer_energy_cost_total')) }}
    actions:
      - variables:
          month_start: >-
            {{ now().replace(day=1, hour=0, minute=0, second=0,
               microsecond=0).isoformat() }}
          energy_year_start: >-
            {% set y = now().year if now().month >= 7 else now().year - 1 %}
            {{ now().replace(year=y, month=7, day=1, hour=0, minute=0,
               second=0, microsecond=0).isoformat() }}
      - action: recorder.get_statistics
        data:
          statistic_ids:
            - sensor.slimmelezer_electricity_total
            - sensor.slimmelezer_mini_gas_consumed
            - sensor.slimmelezer_energy_cost_total
          start_time: "{{ month_start }}"
          period: hour
          types:
            - change
            - state
        response_variable: month_stats
      - action: recorder.get_statistics
        data:
          statistic_ids:
            - sensor.slimmelezer_electricity_total
            - sensor.slimmelezer_mini_gas_consumed
          start_time: "{{ energy_year_start }}"
          period: hour
          types:
            - change
            - state
        response_variable: year_stats
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {% set m = month_stats.get('statistics', {}) %}
                  {% set y = year_stats.get('statistics', {}) %}
                  {{ m.get('sensor.slimmelezer_electricity_total', []) | count > 0
                     and m.get('sensor.slimmelezer_mini_gas_consumed', []) | count > 0
                     and m.get('sensor.slimmelezer_energy_cost_total', []) | count > 0
                     and y.get('sensor.slimmelezer_electricity_total', []) | count > 0
                     and y.get('sensor.slimmelezer_mini_gas_consumed', []) | count > 0 }}
            sequence:
              - variables:
                  month_electricity: >-
                    {% set p = month_stats.statistics['sensor.slimmelezer_electricity_total'] %}
                    {% set n = namespace(total=0) %}
                    {% for item in p %}
                      {% set n.total = n.total + (item.change | float(0)) %}
                    {% endfor %}
                    {% set current = states('sensor.slimmelezer_electricity_total') | float(0) %}
                    {% set last = p[-1].state | float(current) %}
                    {{ [n.total + current - last, 0] | max | round(5) }}
                  month_gas: >-
                    {% set p = month_stats.statistics['sensor.slimmelezer_mini_gas_consumed'] %}
                    {% set n = namespace(total=0) %}
                    {% for item in p %}
                      {% set n.total = n.total + (item.change | float(0)) %}
                    {% endfor %}
                    {% set current = states('sensor.slimmelezer_mini_gas_consumed') | float(0) %}
                    {% set last = p[-1].state | float(current) %}
                    {{ [n.total + current - last, 0] | max | round(5) }}
                  month_cost: >-
                    {% set p = month_stats.statistics['sensor.slimmelezer_energy_cost_total'] %}
                    {% set n = namespace(total=0) %}
                    {% for item in p %}
                      {% set n.total = n.total + (item.change | float(0)) %}
                    {% endfor %}
                    {% set current = states('sensor.slimmelezer_energy_cost_total') | float(0) %}
                    {% set last = p[-1].state | float(current) %}
                    {{ [n.total + current - last, 0] | max | round(5) }}
                  year_electricity: >-
                    {% set p = year_stats.statistics['sensor.slimmelezer_electricity_total'] %}
                    {% set n = namespace(total=0) %}
                    {% for item in p %}
                      {% set n.total = n.total + (item.change | float(0)) %}
                    {% endfor %}
                    {% set current = states('sensor.slimmelezer_electricity_total') | float(0) %}
                    {% set last = p[-1].state | float(current) %}
                    {{ [n.total + current - last, 0] | max | round(5) }}
                  year_gas: >-
                    {% set p = year_stats.statistics['sensor.slimmelezer_mini_gas_consumed'] %}
                    {% set n = namespace(total=0) %}
                    {% for item in p %}
                      {% set n.total = n.total + (item.change | float(0)) %}
                    {% endfor %}
                    {% set current = states('sensor.slimmelezer_mini_gas_consumed') | float(0) %}
                    {% set last = p[-1].state | float(current) %}
                    {{ [n.total + current - last, 0] | max | round(5) }}
              - action: utility_meter.calibrate
                target:
                  entity_id: sensor.energy_electricity_total_month
                data:
                  value: "{{ month_electricity }}"
              - action: utility_meter.calibrate
                target:
                  entity_id: sensor.energy_gas_total_month
                data:
                  value: "{{ month_gas }}"
              - action: utility_meter.calibrate
                target:
                  entity_id: sensor.energy_cost_total_month
                data:
                  value: "{{ month_cost }}"
              - action: utility_meter.calibrate
                target:
                  entity_id: sensor.energy_electricity_total_energy_year
                data:
                  value: "{{ year_electricity }}"
              - action: utility_meter.calibrate
                target:
                  entity_id: sensor.energy_gas_total_energy_year
                data:
                  value: "{{ year_gas }}"
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.energy_period_meters_seeded
  - id: energy_apply_november_2026_meter_baseline
    alias: Energy - Apply 1 November 2026 meter readings
    description: >-
      Corrects November electricity, gas and cost totals using the cumulative
      meter readings recorded on 1 November 2026. Runs once after the monthly
      meters are initialized and the live P1 registers are confirmed above
      those baseline readings.
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/10"
    conditions:
      - condition: state
        entity_id: input_boolean.energy_november_2026_baseline_applied
        state: "off"
      - condition: template
        value_template: >-
          {{ now().year == 2026
             and now().month == 11
             and is_state('input_boolean.energy_period_meters_seeded', 'on')
             and is_number(states('sensor.slimmelezer_electricity_total'))
             and is_number(states('sensor.slimmelezer_mini_gas_consumed'))
             and (states('sensor.slimmelezer_electricity_total') | float(0)) >= 18436
             and (states('sensor.slimmelezer_mini_gas_consumed') | float(0)) >= 9693 }}
    actions:
      - variables:
          november_electricity: >-
            {{ [states('sensor.slimmelezer_electricity_total') | float(0) - 18436, 0]
               | max | round(3) }}
          november_gas: >-
            {{ [states('sensor.slimmelezer_mini_gas_consumed') | float(0) - 9693, 0]
               | max | round(3) }}
          november_cost: >-
            {{ [
                 ((states('sensor.slimmelezer_electricity_total') | float(0) - 18436)
                  * 0.26697)
                 + ((states('sensor.slimmelezer_mini_gas_consumed') | float(0) - 9693)
                    * 1.43817),
                 0
               ] | max | round(2) }}
      - action: utility_meter.calibrate
        target:
          entity_id: sensor.energy_electricity_total_month
        data:
          value: "{{ november_electricity }}"
      - action: utility_meter.calibrate
        target:
          entity_id: sensor.energy_gas_total_month
        data:
          value: "{{ november_gas }}"
      - action: utility_meter.calibrate
        target:
          entity_id: sensor.energy_cost_total_month
        data:
          value: "{{ november_cost }}"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.energy_november_2026_baseline_applied
  - id: energy_seed_gas_other_month_from_statistics
    alias: Energy - Initialize monthly other gas attribution
    description: >-
      Seeds the new monthly other-gas meter from retained statistics of the
      time-weighted outside-heating counter, preserving tracked November use
      since the attribution counter was first initialized.
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/10"
    conditions:
      - condition: state
        entity_id: input_boolean.energy_gas_other_month_seeded
        state: "off"
      - condition: state
        entity_id: input_boolean.energy_period_meters_seeded
        state: "on"
      - condition: state
        entity_id: input_boolean.energy_gas_attribution_initialized
        state: "on"
      - condition: template
        value_template: >-
          {{ is_number(states('sensor.slimmelezer_gas_outside_heating_time_weighted')) }}
    actions:
      - variables:
          month_start: >-
            {{ now().replace(day=1, hour=0, minute=0, second=0,
               microsecond=0).isoformat() }}
      - action: recorder.get_statistics
        data:
          statistic_ids:
            - sensor.slimmelezer_gas_outside_heating_time_weighted
          start_time: "{{ month_start }}"
          period: hour
          types:
            - change
            - state
        response_variable: other_gas_month_stats
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {% set p = other_gas_month_stats.get('statistics', {}).get(
                     'sensor.slimmelezer_gas_outside_heating_time_weighted', []) %}
                  {{ p | count > 0 }}
            sequence:
              - variables:
                  month_other_gas: >-
                    {% set p = other_gas_month_stats.statistics[
                       'sensor.slimmelezer_gas_outside_heating_time_weighted'] %}
                    {% set n = namespace(total=0) %}
                    {% for item in p %}
                      {% set n.total = n.total + (item.change | float(0)) %}
                    {% endfor %}
                    {% set current = states('sensor.slimmelezer_gas_outside_heating_time_weighted') | float(0) %}
                    {% set last = p[-1].state | float(current) %}
                    {{ [n.total + current - last, 0] | max | round(6) }}
              - action: utility_meter.calibrate
                target:
                  entity_id: sensor.energy_gas_other_time_weighted_month
                data:
                  value: "{{ month_other_gas }}"
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.energy_gas_other_month_seeded
  - id: energy_shower_auto_detection_start
    alias: Energy - Auto-detect shower start
    description: >-
      Starts when bathroom humidity is above 85%, bathroom lights are on,
      and the bathroom door contact reports closed (off).
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.thermometer_living_humidity
        above: 85
        id: humidity_high
      - trigger: state
        entity_id: light.bathroom_lights_all
        to: "on"
        id: bathroom_lights_on
      - trigger: state
        entity_id: binary_sensor.bathroom_door_contact
        to: "off"
        id: bathroom_door_closed
      - trigger: time_pattern
        minutes: "/1"
        id: condition_check
    conditions:
      - condition: state
        entity_id: input_boolean.energy_shower_auto_active
        state: "off"
      - condition: numeric_state
        entity_id: sensor.thermometer_living_humidity
        above: 85
      - condition: state
        entity_id: light.bathroom_lights_all
        state: "on"
      - condition: state
        entity_id: binary_sensor.bathroom_door_contact
        state: "off"
    actions:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.energy_shower_auto_active
      - service: logbook.log
        data:
          name: Shower detection
          message: >-
            Automatic shower detection started · humidity
            {{ states('sensor.thermometer_living_humidity') }}% ·
            lights on · door closed
          entity_id: input_boolean.energy_shower_auto_active

  - id: energy_shower_auto_detection_stop
    alias: Energy - Auto-detect shower end
    description: >-
      Ends after bathroom lights are off for one minute. An open door is an
      optional fallback only after humidity drops below 85%.
    mode: single
    triggers:
      - trigger: state
        entity_id: light.bathroom_lights_all
        to: "off"
        for: "00:01:00"
        id: bathroom_lights_off
      - trigger: state
        entity_id: binary_sensor.bathroom_door_contact
        to: "on"
        for: "00:02:00"
        id: bathroom_door_open
      - trigger: numeric_state
        entity_id: sensor.thermometer_living_humidity
        below: 85
        for: "00:02:00"
        id: humidity_fallen
    conditions:
      - condition: state
        entity_id: input_boolean.energy_shower_auto_active
        state: "on"
      - condition: template
        value_template: >-
          {{ is_state('light.bathroom_lights_all', 'off')
             or (is_state('binary_sensor.bathroom_door_contact', 'on')
                 and is_number(states('sensor.thermometer_living_humidity'))
                 and states('sensor.thermometer_living_humidity') | float(100) < 85) }}
    actions:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.energy_shower_auto_active
      - service: logbook.log
        data:
          name: Shower detection
          message: >-
            Automatic shower detection ended ·
            {{ 'lights off' if is_state('light.bathroom_lights_all', 'off')
               else 'door open and humidity below 85%' }}
          entity_id: input_boolean.energy_shower_auto_active

  - id: energy_baseline_sample_every_five_minutes
    alias: Energy - Learn quiet baseline every 5 minutes
    description: >-
      Learns the normal low-load electricity baseline and gas baselines split by
      thermostat heating demand. Samples are not taken during manual activity sessions.
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/5"
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.energy_baseline_initialized
                state: "off"
            sequence:
              - condition: template
                value_template: >-
                  {{ is_number(states('sensor.slimmelezer_mini_gas_consumed'))
                     and is_number(states('sensor.slimmelezer_electricity_total')) }}
              - service: input_number.set_value
                target:
                  entity_id: input_number.energy_baseline_last_gas_m3
                data:
                  value: "{{ states('sensor.slimmelezer_mini_gas_consumed') | float(0) }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.energy_baseline_last_electricity_kwh
                data:
                  value: "{{ states('sensor.slimmelezer_electricity_total') | float(0) }}"
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.energy_baseline_initialized
        default:
          - variables:
              gas_now: "{{ states('sensor.slimmelezer_mini_gas_consumed') | float(0) }}"
              electricity_now: "{{ states('sensor.slimmelezer_electricity_total') | float(0) }}"
              gas_previous: "{{ states('input_number.energy_baseline_last_gas_m3') | float(0) }}"
              electricity_previous: "{{ states('input_number.energy_baseline_last_electricity_kwh') | float(0) }}"
              gas_valid: "{{ is_number(states('sensor.slimmelezer_mini_gas_consumed')) }}"
              electricity_valid: "{{ is_number(states('sensor.slimmelezer_electricity_total')) }}"
              hvac_action: "{{ state_attr('climate.tstat_838e9c_lyric_t6_thermostat', 'hvac_action') }}"
              quiet_power: >-
                {% set appliance_ids = [
                  'binary_sensor.energy_washer_cycle_running',
                  'binary_sensor.energy_dryer_cycle_running',
                  'switch.dishwasher_power',
                  'switch.oven_power'
                ] %}
                {{ is_number(states('sensor.slimmelezer_mini_power_consumed'))
                   and states('sensor.slimmelezer_mini_power_consumed') | float(999999)
                       <= states('input_number.energy_baseline_max_power_w') | float(450)
                   and state_attr('sensor.slimmelezer_mini_power_consumed', 'unit_of_measurement') == 'W'
                   and (expand(appliance_ids) | selectattr('state', 'eq', 'off') | list | count) == (appliance_ids | count) }}
          - variables:
              gas_delta: "{{ ([gas_now | float(0) - gas_previous | float(0), 0] | max) | round(6) }}"
              electricity_delta: "{{ ([electricity_now | float(0) - electricity_previous | float(0), 0] | max) | round(6) }}"
          # Always advance snapshots so a manual session or an excluded high-load
          # period never spills into the next eligible baseline interval.
          - if:
              - condition: template
                value_template: "{{ gas_valid | bool }}"
            then:
              - service: input_number.set_value
                target:
                  entity_id: input_number.energy_baseline_last_gas_m3
                data:
                  value: "{{ gas_now }}"
          - if:
              - condition: template
                value_template: "{{ electricity_valid | bool }}"
            then:
              - service: input_number.set_value
                target:
                  entity_id: input_number.energy_baseline_last_electricity_kwh
                data:
                  value: "{{ electricity_now }}"
          # Electricity quiet-baseline sample.
          - choose:
              - conditions:
                  - condition: state
                    entity_id: input_boolean.energy_manual_activity_running
                    state: "off"
                  - condition: state
                    entity_id: input_boolean.energy_shower_auto_active
                    state: "off"
                  - condition: template
                    value_template: "{{ (electricity_valid | bool) and (quiet_power | bool) }}"
                sequence:
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.energy_baseline_electricity_5m_sample
                    data:
                      value: "{{ electricity_delta }}"
                  - service: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.energy_baseline_electricity_sample_valid
            default:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.energy_baseline_electricity_sample_valid
          # Gas baseline samples are separated by thermostat demand state.
          - choose:
              - conditions:
                  - condition: state
                    entity_id: input_boolean.energy_manual_activity_running
                    state: "off"
                  - condition: state
                    entity_id: input_boolean.energy_shower_auto_active
                    state: "off"
                  - condition: template
                    value_template: "{{ (gas_valid | bool) and hvac_action == 'heating' }}"
                sequence:
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.energy_baseline_gas_heating_5m_sample
                    data:
                      value: "{{ gas_delta }}"
                  - service: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.energy_baseline_gas_heating_sample_valid
                  - service: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.energy_baseline_gas_idle_sample_valid
              - conditions:
                  - condition: state
                    entity_id: input_boolean.energy_manual_activity_running
                    state: "off"
                  - condition: state
                    entity_id: input_boolean.energy_shower_auto_active
                    state: "off"
                  - condition: template
                    value_template: "{{ (gas_valid | bool) and hvac_action in ['idle', 'off'] }}"
                sequence:
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.energy_baseline_gas_idle_5m_sample
                    data:
                      value: "{{ gas_delta }}"
                  - service: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.energy_baseline_gas_idle_sample_valid
                  - service: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.energy_baseline_gas_heating_sample_valid
            default:
              - service: input_boolean.turn_off
                target:
                  entity_id:
                    - input_boolean.energy_baseline_gas_heating_sample_valid
                    - input_boolean.energy_baseline_gas_idle_sample_valid
          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.energy_baseline_sampled_at
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  - id: energy_manual_hvac_minute_sampler
    alias: Energy - Track thermostat state during manual activity
    description: Samples T6 heating/idle time while a manual gas activity session is active.
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/1"
    conditions:
      - condition: state
        entity_id: input_boolean.energy_manual_activity_running
        state: "on"
    actions:
      - action: script.energy_manual_record_hvac_segment

  - id: energy_gas_time_weighted_attribution
    alias: Energy - Attribute gas by thermostat time share
    description: >-
      Tracks T6 heating/idle/unknown time and automatic shower-active time
      between gas-meter updates. Shower gas is an overlapping time-share
      estimate, not an exclusive additional gas category. Assumes gas flow is
      uniform across the interval.
    mode: queued
    max: 50
    triggers:
      - trigger: homeassistant
        event: start
        id: startup
      - trigger: time_pattern
        minutes: "/1"
        id: heartbeat
      - trigger: state
        entity_id: climate.tstat_838e9c_lyric_t6_thermostat
        attribute: hvac_action
        id: thermostat
      - trigger: state
        entity_id: input_boolean.energy_shower_auto_active
        id: shower_state
      - trigger: state
        entity_id: sensor.slimmelezer_mini_gas_consumed
        id: gas_meter
    conditions:
      - condition: template
        value_template: >-
          {{ (is_state('input_boolean.energy_gas_attribution_initialized', 'on')
              or is_number(states('sensor.slimmelezer_mini_gas_consumed')))
             and (trigger.id != 'gas_meter'
              or is_number(states('sensor.slimmelezer_mini_gas_consumed'))) }}
    actions:
      - variables:
          now_timestamp: "{{ as_timestamp(now()) }}"
          last_sample_timestamp: >-
            {{ as_timestamp(states('input_datetime.energy_gas_interval_last_sample'),
               as_timestamp(now())) }}
          elapsed_seconds: >-
            {{ [(now_timestamp | float(0)) - (last_sample_timestamp | float(0)), 0] | max }}
          previous_hvac_state: "{{ states('input_select.energy_gas_previous_hvac_state') }}"
          current_hvac_state: >-
            {{ 'heating' if state_attr('climate.tstat_838e9c_lyric_t6_thermostat', 'hvac_action') == 'heating'
               else 'idle' if state_attr('climate.tstat_838e9c_lyric_t6_thermostat', 'hvac_action') in ['idle', 'off']
               else 'unknown' }}
          previous_shower_active: "{{ states('input_boolean.energy_gas_previous_shower_active') }}"
          gas_now: "{{ states('sensor.slimmelezer_mini_gas_consumed') | float(0) }}"
          gas_previous: "{{ states('input_number.energy_gas_last_meter_m3') | float(0) }}"
          gas_delta: >-
            {{ [(gas_now | float(0)) - (gas_previous | float(0)), 0] | max }}
          heating_seconds: >-
            {{ states('input_number.energy_gas_interval_heating_seconds') | float(0)
               + (elapsed_seconds | float(0) if previous_hvac_state == 'heating' else 0) }}
          idle_seconds: >-
            {{ states('input_number.energy_gas_interval_idle_seconds') | float(0)
               + (elapsed_seconds | float(0) if previous_hvac_state == 'idle' else 0) }}
          unknown_seconds: >-
            {{ states('input_number.energy_gas_interval_unknown_seconds') | float(0)
               + (elapsed_seconds | float(0) if previous_hvac_state not in ['heating', 'idle'] else 0) }}
          shower_seconds: >-
            {{ states('input_number.energy_gas_interval_shower_seconds') | float(0)
               + (elapsed_seconds | float(0) if previous_shower_active == 'on' else 0) }}
          total_interval_seconds: >-
            {{ heating_seconds | float(0) + idle_seconds | float(0) + unknown_seconds | float(0) }}
          heating_gas_delta: >-
            {{ ((gas_delta | float(0)) * (heating_seconds | float(0))
                / (total_interval_seconds | float(1))) if total_interval_seconds | float(0) > 0 else 0 }}
          idle_gas_delta: >-
            {{ ((gas_delta | float(0)) * (idle_seconds | float(0))
                / (total_interval_seconds | float(1))) if total_interval_seconds | float(0) > 0 else 0 }}
          unknown_gas_delta: >-
            {{ [(gas_delta | float(0)) - (heating_gas_delta | float(0))
                - (idle_gas_delta | float(0)), 0] | max }}
          shower_gas_delta: >-
            {{ ((gas_delta | float(0)) * ([shower_seconds | float(0), total_interval_seconds | float(0)] | min)
                / (total_interval_seconds | float(1))) if total_interval_seconds | float(0) > 0 else 0 }}
      - choose:
          # First run: take a gas-meter baseline; do not backfill prior use.
          - conditions:
              - condition: state
                entity_id: input_boolean.energy_gas_attribution_initialized
                state: "off"
            sequence:
              - service: input_number.set_value
                target:
                  entity_id: input_number.energy_gas_last_meter_m3
                data:
                  value: "{{ gas_now }}"
              - service: input_number.set_value
                target:
                  entity_id:
                    - input_number.energy_gas_interval_heating_seconds
                    - input_number.energy_gas_interval_idle_seconds
                    - input_number.energy_gas_interval_unknown_seconds
                    - input_number.energy_gas_interval_shower_seconds
                    - input_number.energy_gas_time_weighted_heating_total_m3
                    - input_number.energy_gas_time_weighted_other_total_m3
                    - input_number.energy_gas_time_weighted_unknown_total_m3
                    - input_number.energy_gas_time_weighted_shower_total_m3
                data:
                  value: 0
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.energy_gas_attribution_initialized
          # On restart, mark the period Home Assistant was offline as unknown.
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'startup' }}"
            sequence:
              - service: input_number.set_value
                target:
                  entity_id: input_number.energy_gas_interval_unknown_seconds
                data:
                  value: "{{ (states('input_number.energy_gas_interval_unknown_seconds') | float(0) + elapsed_seconds | float(0)) | round(0) }}"
        # Normal interval accounting.
        default:
          - choose:
              # Allocate the measured meter delta using the whole interval's
              # heating / idle / unknown time proportions.
              - conditions:
                  - condition: template
                    value_template: "{{ trigger.id == 'gas_meter' and gas_delta | float(0) > 0 }}"
                sequence:
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.energy_gas_time_weighted_heating_total_m3
                    data:
                      value: "{{ (states('input_number.energy_gas_time_weighted_heating_total_m3') | float(0) + heating_gas_delta | float(0)) | round(6) }}"
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.energy_gas_time_weighted_other_total_m3
                    data:
                      value: "{{ (states('input_number.energy_gas_time_weighted_other_total_m3') | float(0) + idle_gas_delta | float(0)) | round(6) }}"
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.energy_gas_time_weighted_unknown_total_m3
                    data:
                      value: "{{ (states('input_number.energy_gas_time_weighted_unknown_total_m3') | float(0) + unknown_gas_delta | float(0)) | round(6) }}"
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.energy_gas_time_weighted_shower_total_m3
                    data:
                      value: "{{ (states('input_number.energy_gas_time_weighted_shower_total_m3') | float(0) + shower_gas_delta | float(0)) | round(6) }}"
                  - service: input_number.set_value
                    target:
                      entity_id:
                        - input_number.energy_gas_interval_heating_seconds
                        - input_number.energy_gas_interval_idle_seconds
                        - input_number.energy_gas_interval_unknown_seconds
                        - input_number.energy_gas_interval_shower_seconds
                    data:
                      value: 0
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.energy_gas_last_meter_m3
                    data:
                      value: "{{ gas_now }}"
            default:
              # No positive meter delta yet: keep accumulating the interval.
              - service: input_number.set_value
                target:
                  entity_id: input_number.energy_gas_interval_heating_seconds
                data:
                  value: "{{ heating_seconds | round(0) }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.energy_gas_interval_idle_seconds
                data:
                  value: "{{ idle_seconds | round(0) }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.energy_gas_interval_unknown_seconds
                data:
                  value: "{{ unknown_seconds | round(0) }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.energy_gas_interval_shower_seconds
                data:
                  value: "{{ shower_seconds | round(0) }}"
              - if:
                  - condition: template
                    value_template: "{{ trigger.id == 'gas_meter' and gas_now | float(0) < gas_previous | float(0) }}"
                then:
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.energy_gas_last_meter_m3
                    data:
                      value: "{{ gas_now }}"
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.energy_gas_interval_last_sample
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - service: input_select.select_option
        target:
          entity_id: input_select.energy_gas_previous_hvac_state
        data:
          option: "{{ current_hvac_state }}"
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.energy_shower_auto_active
                state: "on"
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.energy_gas_previous_shower_active
        default:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.energy_gas_previous_shower_active

