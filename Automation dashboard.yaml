title: Automation Control

button_card_templates:
  room_activity:
    show_state: false
    show_icon: true
    show_label: true
    show_name: true
    update_timer: 5000
    triggers_update: update_timer
    variables:
      room: ""
      room_keywords: []
    label: |
      [[[
        const cutoff = Date.now() - 10 * 60 * 1000;
        const keywords = (variables.room_keywords || []).map(k => k.toLowerCase());
        const matches = Object.values(states)
          .filter(s => s.entity_id && s.entity_id.startsWith("automation."))
          .filter(s => {
            const name = String(s.attributes.friendly_name || s.entity_id).toLowerCase();
            return !/must fix|not working|\bold\b/.test(name) &&
              keywords.some(keyword => name.includes(keyword));
          })
          .filter(s => {
            const last = s.attributes.last_triggered;
            return last && new Date(last).getTime() >= cutoff;
          })
          .sort((a, b) => new Date(b.attributes.last_triggered) - new Date(a.attributes.last_triggered));
        if (!matches.length) return "Quiet";
        const last = new Date(matches[0].attributes.last_triggered);
        const minutes = Math.max(0, Math.floor((Date.now() - last.getTime()) / 60000));
        if (minutes < 60) return "Last: " + minutes + "m";
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return "Last: " + hours + "h";
        return "Last: " + Math.floor(hours / 24) + "d";
      ]]]
    tap_action:
      action: call-service
      service: input_select.select_option
      target:
        entity_id: input_select.automation_room_filter
      data:
        option: |
          [[[
            const selected = states["input_select.automation_room_filter"]?.state;
            return selected === variables.room ? "All rooms" : variables.room;
          ]]]
    styles:
      card:
        - border-radius: 12px
        - padding: 12px
        - aspect-ratio: 1/1
        - position: relative
        - border: |
            [[[
              const selected = states["input_select.automation_room_filter"]?.state;
              return selected === variables.room ? "2px solid #f1c40f" : "1px solid transparent";
            ]]]
        - background-color: |
            [[[
              const cutoff = Date.now() - 10 * 60 * 1000;
              const keywords = (variables.room_keywords || []).map(k => k.toLowerCase());
              const active = Object.values(states).some(s => {
                if (!s.entity_id || !s.entity_id.startsWith("automation.")) return false;
                const name = String(s.attributes.friendly_name || s.entity_id).toLowerCase();
                if (/must fix|not working|\bold\b/.test(name)) return false;
                if (!keywords.some(keyword => name.includes(keyword))) return false;
                const last = s.attributes.last_triggered;
                return last && new Date(last).getTime() >= cutoff;
              });
              return active ? "#2471A3" : "var(--card-background-color, #1c1c1e)";
            ]]]
      icon:
        - width: 42%
        - color: white
      name:
        - font-weight: bold
        - font-size: 12px
        - color: white
      label:
        - font-size: 10px
        - color: "#E0E0E0"
        - white-space: normal

  automation_header:
    show_icon: false
    show_state: false
    show_name: true
    tap_action:
      action: none
    styles:
      card:
        - width: 100%
        - min-width: 0
        - border-radius: 8px
        - padding: 8px 4px
        - background-color: "#252525"
        - box-shadow: none
        - overflow: visible
      grid:
        - grid-template-areas: '"n description last_triggered count actions"'
        - grid-template-columns: minmax(0, 1.35fr) minmax(0, 1.5fr) minmax(74px, 1fr) minmax(58px, 0.6fr) minmax(132px, 1.4fr)
        - column-gap: 5px
      name:
        - min-width: 0
        - justify-self: start
        - font-size: 11px
        - font-weight: bold
        - white-space: normal
        - overflow-wrap: anywhere
        - color: white
      custom_fields:
        description:
          - min-width: 0
          - justify-self: start
          - font-size: 10px
          - font-weight: bold
          - white-space: normal
          - overflow-wrap: anywhere
          - color: white
        last_triggered:
          - min-width: 0
          - justify-self: start
          - font-size: 10px
          - font-weight: bold
          - white-space: normal
          - overflow-wrap: anywhere
          - color: white
        count:
          - min-width: 0
          - justify-self: center
          - text-align: center
          - font-size: 10px
          - font-weight: bold
          - white-space: normal
          - color: white
        actions:
          - min-width: 0
          - justify-self: center
          - text-align: center
          - font-size: 10px
          - font-weight: bold
          - color: white
    custom_fields:
      description: Short description
      last_triggered: Last Triggered
      count: Count (last 7d)
      actions: Actions

  automation_row:
    show_icon: false
    show_state: false
    show_label: false
    show_name: true
    tap_action:
      action: more-info
    hold_action:
      action: more-info
    styles:
      card:
        - width: 100%
        - min-width: 0
        - border-radius: 0
        - padding: 6px 4px
        - box-shadow: none
        - border-bottom: 1px solid var(--divider-color)
        - overflow: visible
      grid:
        - grid-template-areas: '"n description last_triggered count actions"'
        - grid-template-columns: minmax(0, 1.35fr) minmax(0, 1.5fr) minmax(74px, 1fr) minmax(58px, 0.6fr) minmax(132px, 1.4fr)
        - column-gap: 5px
      name:
        - min-width: 0
        - justify-self: start
        - text-align: left
        - white-space: normal
        - overflow-wrap: anywhere
        - font-size: 11px
        - font-weight: 500
      custom_fields:
        description:
          - min-width: 0
          - justify-self: start
          - text-align: left
          - white-space: normal
          - overflow-wrap: anywhere
          - font-size: 10px
          - color: var(--secondary-text-color)
        last_triggered:
          - min-width: 0
          - justify-self: start
          - text-align: left
          - white-space: normal
          - overflow-wrap: anywhere
          - font-size: 10px
        count:
          - min-width: 0
          - justify-self: center
          - text-align: center
          - font-size: 11px
        actions:
          - min-width: 0
          - width: 100%
          - justify-self: center
          - align-self: center
          - overflow: visible
    custom_fields:
      description: |
        [[[
          return variables.short_description || entity.attributes.description || "No description";
        ]]]
      last_triggered: |
        [[[
          const value = entity.attributes.last_triggered;
          if (!value) return "Never";
          const dt = new Date(value);
          return dt.toLocaleString([], {
            day: "2-digit",
            month: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
          });
        ]]]
      count: |
        [[[
          // A rolling 7-day run count needs a separate recorder-backed counter.
          return "—";
        ]]]
      actions: " "


