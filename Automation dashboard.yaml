                          'grid': [{'grid-template-areas': '"i" "n"'}, {'grid-template-columns': '1fr'}, {'grid-template-rows': '20px min-content'}],
                          'icon': [{'width': '18px'}],
                          'name': [{'font-size': '9px'}, {'justify-self': 'center'}, {'white-space': 'nowrap'}]
                        }
                      }
                    ] %}
                    {% set ns.items = ns.items + [{
                      'type': 'custom:button-card',
                      'entity': a.entity_id,
                      'template': 'automation_row',
                      'variables': {'short_description': description_map.get(name, '')},
                      'custom_fields': {
                        'actions': {
                          'card': {
                            'type': 'horizontal-stack',
                            'cards': action_cards
                          }
                        }
                      }
                    }] %}
