              - type: custom:button-card
                name: Bath
                icon: mdi:shower
                template: room_activity
                variables:
                  room: Bath
                  room_keywords: ["bathroom", "bath", "toilet"]
              - type: custom:button-card
                name: Hal
                icon: mdi:coat-rack
                template: room_activity
                variables:
                  room: Hal
