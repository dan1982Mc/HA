                    'must fix' in name or
                    'not working' in name or
                    'old' in name %}
                  {% set room_match =
                    selected in ['All rooms', 'unknown', 'unavailable', ''] or
                    (selected == 'Kitchen' and 'kitchen' in name) or
                    (selected == 'Small bed' and ('small bedroom' in name or 'small bed' in name)) or
                    (selected == 'Big bed' and ('big bedroom' in name or 'big bed' in name or 'master bedroom' in name)) or
                    (selected == 'Bath' and ('bathroom' in name or 'bath' in name or 'toilet' in name)) or
                    (selected == 'Entry' and ('entry' in name or 'front door' in name or 'rear door' in name or 'doorbell' in name)) or
                    (selected == 'Hal' and ('hallway' in name or 'hall' in name)) or
                    (selected == 'Storage' and 'storage' in name) or
                    (selected == 'Living room' and ('living room' in name or 'livingroom' in name or 'living-room' in name)) or
